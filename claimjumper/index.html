/* ============================================================
   CLAIMJUMPER! — browser build
   v2.0 "THE LONG SEASON" feature pass, built on top of the v1.x
   single-file build (1,138 lines, ported 1:1 from the hardware-
   tested Playdate Lua source). This pass adds: lives/credits/

   platform movement + dodging,

   miner art, and the guaranteed bottle-of-vinegar encounter.
   Self-contained vanilla JS + Canvas. No dependencies.
   ============================================================ */

// base64 (each "XPng" key), ~1.45MB combined -- about 90% of this file's

// SPR_DATA.figPng, SPR_MINER_DATA.minerPng, SPR_COCKED_DATA and
// SPR_SPEAR_DATA only render at all if those newer systems fail to load,
// which in practice they don't. Left in place rather than deleted --
// that's a real behavior change (removing a fallback path), out of scope
// for a mechanical split, and worth a human/local-model decision of its
// own rather than a drive-by cut.
const SPR_DATA = {"fishAtlas":{"_source":"Adobe Firefly clip My_Movie.mov (1280x720 h264, 30fps), frames [1, 4, 7, 10, 13, 16, 19, 22] of the locked-off opening shot","_note":"All species normalised to face RIGHT; mirror in code for left-swimming fish. Source facing recorded per-species below.","image":"claimjumper_fish.png","scaleFromSource":0.16667,"playback":{"sourceFps":30,"frameStepInSource":3,"effectiveFps":10.0,"loop":"pingpong","loopOrder":[0,1,2,3,4,5,6,7,6,5,4,3,2,1],"_why":"the source drifts rather than cycling, so a ping-pong loop is required to avoid a visible pop at the wrap"},"anchor":"noseTip","sprites":{"redband":{"sourceFacing":"R","normalisedFacing":"R","frameW":93,"frameH":40,"noseTip":{"x":91,"y":21},"animations":{"swim":{"frames":[0,1,2,3,4,5,6,7]}},"frames":[{"x":0,"y":0,"w":93,"h":40},{"x":93,"y":0,"w":93,"h":40},{"x":186,"y":0,"w":93,"h":40},{"x":279,"y":0,"w":93,"h":40},{"x":372,"y":0,"w":93,"h":40},{"x":465,"y":0,"w":93,"h":40},{"x":558,"y":0,"w":93,"h":40},{"x":651,"y":0,"w":93,"h":40}]},"bull":{"sourceFacing":"L","normalisedFacing":"R","frameW":99,"frameH":38,"noseTip":{"x":97,"y":21},"animations":{"swim":{"frames":[0,1,2,3,4,5,6,7]}},"frames":[{"x":0,"y":40,"w":99,"h":38},{"x":99,"y":40,"w":99,"h":38},{"x":198,"y":40,"w":99,"h":38},{"x":297,"y":40,"w":99,"h":38},{"x":396,"y":40,"w":99,"h":38},{"x":495,"y":40,"w":99,"h":38},{"x":594,"y":40,"w":99,"h":38},{"x":693,"y":40,"w":99,"h":38}]},"chinook":{"sourceFacing":"R","normalisedFacing":"R","frameW":104,"frameH":43,"noseTip":{"x":102,"y":22},"animations":{"swim":{"frames":[0,1,2,3,4,5,6,7]}},"frames":[{"x":0,"y":78,"w":104,"h":43},{"x":104,"y":78,"w":104,"h":43},{"x":208,"y":78,"w":104,"h":43},{"x":312,"y":78,"w":104,"h":43},{"x":416,"y":78,"w":104,"h":43},{"x":520,"y":78,"w":104,"h":43},{"x":624,"y":78,"w":104,"h":43},{"x":728,"y":78,"w":104,"h":43}]},"steelhead":{"sourceFacing":"L","normalisedFacing":"R","frameW":98,"frameH":39,"noseTip":{"x":92,"y":20},"animations":{"swim":{"frames":[0,1,2,3,4,5,6,7]}},"frames":[{"x":0,"y":121,"w":98,"h":39},{"x":98,"y":121,"w":98,"h":39},{"x":196,"y":121,"w":98,"h":39},{"x":294,"y":121,"w":98,"h":39},{"x":392,"y":121,"w":98,"h":39},{"x":490,"y":121,"w":98,"h":39},{"x":588,"y":121,"w":98,"h":39},{"x":686,"y":121,"w":98,"h":39}]}}},"figAtlas":{"_source":"Adobe Firefly clip My_Movie.mov, platform shot (frames 109-176). Camera static.","_note":"Figure faces RIGHT, spear extended. These are HOLD poses, not a throw cycle -- the source footage contains no windup, release, walk or idle. See handoff notes.","image":"claimjumper_figure.png","scaleFromSource":0.16667,"anchor":"feetCentre","feetCentre":{"x":44,"y":65},"frameW":122,"frameH":74,"aimPoses":[{"name":"down_steep","index":0,"spearAngleDeg":-43.6,"sourceFrame":112,"x":0,"y":0,"w":122,"h":74},{"name":"down_hard","index":1,"spearAngleDeg":-34.6,"sourceFrame":132,"x":122,"y":0,"w":122,"h":74},{"name":"down_mid","index":2,"spearAngleDeg":-22.3,"sourceFrame":137,"x":244,"y":0,"w":122,"h":74},{"name":"down_soft","index":3,"spearAngleDeg":-10.6,"sourceFrame":142,"x":366,"y":0,"w":122,"h":74},{"name":"level","index":4,"spearAngleDeg":-0.2,"sourceFrame":147,"x":488,"y":0,"w":122,"h":74},{"name":"up_soft","index":5,"spearAngleDeg":9.0,"sourceFrame":154,"x":610,"y":0,"w":122,"h":74}]},"figBuckets":[{"index":0,"gameAngle":43.6,"x":0,"y":0,"w":122,"h":74},{"index":1,"gameAngle":34.6,"x":122,"y":0,"w":122,"h":74},{"index":2,"gameAngle":22.3,"x":244,"y":0,"w":122,"h":74},{"index":3,"gameAngle":10.6,"x":366,"y":0,"w":122,"h":74},{"index":4,"gameAngle":8,"x":488,"y":0,"w":122,"h":74},{"index":5,"gameAngle":8,"x":610,"y":0,"w":122,"h":74}]};

const SPR_MINER_DATA = {"minerAtlas":{"_source":"WHITE_GUY.MP4 pier-walk shot, frames [118, 124, 130, 136, 142, 148, 190, 160]","image":"claimjumper_miner.png","scaleFromSource":0.3,"anchor":"feetCentre","frameW":244,"frameH":151,"feetCentre":{"x":106,"y":149},"animations":{"walk":{"frames":[0,1,2,3,4,5]},"stand":{"frames":[6]},"bend":{"frames":[7]}},"frames":[{"x":0,"y":0,"w":244,"h":151,"sourceFrame":118},{"x":244,"y":0,"w":244,"h":151,"sourceFrame":124},{"x":488,"y":0,"w":244,"h":151,"sourceFrame":130},{"x":732,"y":0,"w":244,"h":151,"sourceFrame":136},{"x":976,"y":0,"w":244,"h":151,"sourceFrame":142},{"x":1220,"y":0,"w":244,"h":151,"sourceFrame":148},{"x":1464,"y":0,"w":244,"h":151,"sourceFrame":190},{"x":1708,"y":0,"w":244,"h":151,"sourceFrame":160}]}};
const SPR_COCKED_DATA = {"cockedAtlas":{"_source":"Firefly clip 'throwing and releasing his spear' (locked-off, frame 49)","_note":"v2: standing, arm bent, spear pulled back close to the body -- genuinely 'about to strike', unlike the first attempt (frame 100), which had the spear already extended forward mid-thrust and read as broken/backwards during a charging state.","image":"claimjumper_cocked.png","scaleFromSource":0.16667,"anchor":"feetCentre","feetCentre":{"x":18,"y":72},"frameW":107,"frameH":73}};
const SPR_SPEAR_DATA = {"spearAtlas":{"_source":"Firefly clip 'throwing and releasing his spear' (locked-off, frame 100), cord/tether cropped out -- shaft and head only","_note":"For the flying-spear render: rotate this image about `grip` to match the existing sp.vx/sp.vy flight angle, same idiom the procedural drawSpear() used.","image":"claimjumper_spear.png","scaleFromSource":0.16667,"anchor":"grip","grip":{"x":0,"y":7},"frameW":53,"frameH":12}};
const SPR_BG_DATA = {};
const SPR_SCENE_DATA = {"deckW":160,"deckH":85,"trestleW":262,"trestleH":242};
const SPR = { ready:false, fishImg:null, figImg:null, minerImg:null, cockedImg:null, spearImg:null, skyImg:null, poolImg:null, sceneImg:null, deckImg:null, trestleImg:null };

// v7 GDD §1.1: Rock-Thrower/Archer/Prospector/Soldier character-skin art,
// loaded independently of SPR so a failure here can't affect the base
// sprite pipeline -- drawMiner/drawVinegarMiner check SKINS[key] directly
// and fall back to the existing sprite-sheet body if a skin never loads,
// same "never hard-fail on an asset problem" spirit as loadSprites above.
const SKINS = { ready:false, rockthrower:null, archer:null, prospector:null, soldier:null };
(function loadSkins(){
  const files = { rockthrower:'assets/rockthrower.png', archer:'assets/archer.png', prospector:'assets/prospector.png', soldier:'assets/soldier.png' };
  let n=0, done=0;
  function chk(){ done++; if (done>=n) SKINS.ready = true; }
  // Retries a failed load up to 3 attempts (with a short, growing delay and
  // a cache-busting query param so a retry doesn't just hit a cached
  // failure) before giving up -- verified files are byte-valid PNGs
  // identical in structure to ones that do load, so a load failure here
  // is a transient network hiccup to recover from, not a bad asset.
  function loadOne(key, src, attempt){
    const img = new Image();
    img.onload = () => { SKINS[key] = img; chk(); };
    img.onerror = () => {
      if (attempt < 3) setTimeout(() => loadOne(key, src, attempt + 1), 400 * attempt);
      else chk();
    };
    img.src = attempt === 1 ? src : (src + '?retry=' + attempt);
  }
  for (const key in files){
    n++;
    loadOne(key, files[key], 1);
  }
})();

// v7.3: animated miner skins, extracted from Firefly-generated video clips
// (CLAIMJUMPER_NEW_ASSETS_OCT_2026.zip -- 8-second/24fps clips per
// character, each showing a real held stance + wind-up + release, not
// just a static pose). Frames were background-removed the same way as
// the Oct backgrounds (Firefly's "transparent" export is a picture of a
// checkerboard, not real alpha), then masked to each frame's largest
// connected component so the release frames' baked-in flying rock+motion
// trail don't ship at all -- that rock would otherwise double up visually
// with the game's own separately-spawned projectile. All frames of one
// skin share an identical crop rectangle (the union of every frame's body
// silhouette), so anchorX/anchorY is ONE fixed point valid across the
// whole animation -- verified the feet sit at the same source pixel row
// in every frame first, so there's no per-frame anchor drift.
// Keyed like SKINS; a skin with no entry here (or not yet loaded) falls
// back to SKINS[]'s single static pose in drawMinerSkin() -- same
// graceful, per-skin rollout as every other asset loader in this file.
const MINER_ANIM = {};
const MINER_ANIM_SPEC = {
  rockthrower: {
    dir: 'assets/anim/rockthrower/',
    stand: ['stand.png'],
    wind: ['wind1.png','wind2.png','wind3.png','wind4.png','wind5.png'],
    release: ['release1.png','release2.png','release3.png','release4.png','release5.png','release6.png','release7.png','release8.png'],
    anchorX: 194, anchorY: 244, // stance-center / feet row, shared by every frame in this set
  },
  soldier: {
    dir: 'assets/anim/soldier/',
    // v7.3: soldier's source clip stands him on a full-width dock, unlike
    // rockthrower's standalone footage -- his feet touching the dock's own
    // opaque pixels merged them into one connected blob during background
    // removal, so the extraction masked out everything at/below the dock's
    // own top row (y=556 in the source frame) before isolating "largest
    // component", for both the walk and stand/wind/release frame sets.
    // walk: each frame individually tight-cropped (he physically
    // traverses real screen distance while walking, so a shared rectangle
    // would misalign the feet the way it did for stand/wind/release) --
    // rendered with simple center-x/bottom-y anchoring, same convention as
    // the original static skins, not the shared anchorX/anchorY below.
    walk: ['walk1.png','walk2.png','walk3.png','walk4.png','walk5.png','walk6.png','walk7.png','walk8.png'],
    stand: ['stand.png'],
    wind: ['wind1.png','wind2.png','wind3.png','wind4.png','wind5.png'],
    release: ['release1.png','release2.png','release3.png','release4.png','release5.png','release6.png','release7.png','release8.png'],
    anchorX: 95, anchorY: 170, // stand/wind/release only -- stationary, so this shared rectangle's anchor holds
  },
  prospector: {
    dir: 'assets/anim/prospector/',
    // v7.3: prospector's throw clip bakes in the thrown gold nugget PLUS a
    // soft ambient glow that trails it -- unlike rockthrower's rock/soldier's
    // bottle (small, cleanly separable), this glow is one continuous soft
    // gradient fused to the body in the same connected blob, with no gap a
    // largest-component pass can find. Fixed positionally instead: columns
    // left of x=410 (source pixels) are masked out before isolating the body
    // in the last wind frame and all release frames, the only ones the glow
    // reaches. Costs the very fingertip of the pointing gesture in later
    // release frames (it points into where the glow was) -- an acceptable
    // trade at ~50px render height.
    walk: ['walk1.png','walk2.png','walk3.png','walk4.png','walk5.png','walk6.png','walk7.png','walk8.png'],
    stand: ['stand.png'],
    wind: ['wind1.png','wind2.png','wind3.png','wind4.png','wind5.png'],
    release: ['release1.png','release2.png','release3.png','release4.png','release5.png','release6.png','release7.png','release8.png'],
    anchorX: 136, anchorY: 272,
  },
  archer: {
    dir: 'assets/anim/archer/',
    // v7.3: archer's clip is standalone like rockthrower's but stands him
    // on his own short plank -- same dock-merge problem as soldier's, same
    // fix (body_only_above, y=558 in the source frame). Unlike
    // prospector's, the thrown arrow is small and cleanly separates from
    // the body once released (same as rockthrower's rock) -- no positional
    // cutoff needed here, plain largest-component isolation is enough.
    // The clip never shows the bow fully relaxed/undrawn, so 'stand'
    // reuses the loop's own resting point (already mid-recovery, about to
    // draw again) rather than an idle pose that doesn't exist in the
    // source footage.
    // v7.3.1: unlike the other four, archer's source clip faced RIGHT (all
    // the others happened to face left already) -- missed at ship time, so
    // he drew facing away from the player and walked toward the pier
    // backwards. Fixed by flipping every frame in this set horizontally
    // (offline, same precedent as the original rockthrower.png facing fix
    // from before the animation pass), not with a runtime ctx.scale --
    // walk's own center-x/bottom-y anchor is symmetric under a flip so it
    // needed no change, but anchorX here is mirrored (275-180=95) to match.
    walk: ['walk1.png','walk2.png','walk3.png','walk4.png','walk5.png','walk6.png','walk7.png','walk8.png'],
    stand: ['stand.png'],
    wind: ['wind1.png','wind2.png','wind3.png','wind4.png','wind5.png'],
    release: ['release1.png','release2.png','release3.png','release4.png','release5.png','release6.png','release7.png','release8.png'],
    anchorX: 95, anchorY: 194,
  },
};
(function loadMinerAnim(){
  for (const skin in MINER_ANIM_SPEC){
    const spec = MINER_ANIM_SPEC[skin];
    const entry = { walk:[], stand:[], wind:[], release:[], anchorX:spec.anchorX, anchorY:spec.anchorY, ready:false };
    MINER_ANIM[skin] = entry;
    const allFiles = [];
    for (const phase of ['walk','stand','wind','release']){
      (spec[phase] || []).forEach((fn, i) => allFiles.push({ phase, i, src: spec.dir + fn }));
    }
    let done = 0;
    function loadOne(f, attempt){
      const img = new Image();
      img.onload = () => { entry[f.phase][f.i] = img; done++; if (done>=allFiles.length) entry.ready = true; };
      img.onerror = () => {
        if (attempt < 3) setTimeout(() => loadOne(f, attempt + 1), 400 * attempt);
        else { done++; if (done>=allFiles.length) entry.ready = true; }
      };
      img.src = attempt === 1 ? f.src : (f.src + '?retry=' + attempt);
    }
    allFiles.forEach(f => loadOne(f, 1));
  }
})();

// The five level-background stills -- both the WAVEINTRO card's backdrop
// and the live PLAY scene itself (see drawSky()). One per wave, in wave
// order: index i is WAVES[i]'s backdrop. v7.1 cut WAVES down to exactly
// five entries so this is a fixed 1:1 mapping, not a cycling pool -- each
// wave is meant to be a genuinely distinct point in this river valley's
// history (see WAVES' names/comment above), not a repeating art set.
const WAVE_BG_FILES = ['assets/bg_mountainvista.png','assets/bg_rockycliff.png','assets/bg_esmeralda.png','assets/bg_pinegrove.png','assets/bg_junctionbar.png'];
const WAVE_BGS = [];
(function loadWaveBackgrounds(){
  WAVE_BG_FILES.forEach((src, i) => {
    const img = new Image();
    img.onload = () => { WAVE_BGS[i] = img; };
    img.src = src;
  });
})();
function waveBackdrop(){
  return WAVE_BGS[(G.wave - 1) % WAVE_BG_FILES.length];
}

// New reference art for the player figure and the tower/platform he stands
// on (a real fishing-tower design, not the earlier trestle-scaffold crop).
// Loaded independently, same graceful-fallback spirit as SKINS/WAVE_BGS: if
// either fails to load, drawFigure/drawPlatform fall back to their existing
// rendering rather than breaking.
const PLAYER_ART = { tower: null, pier: null };
(function loadPlayerArt(){
  const t = new Image(); t.onload = () => { PLAYER_ART.tower = t; }; t.src = 'assets/player_tower.png';
  const p = new Image(); p.onload = () => { PLAYER_ART.pier = p; }; p.src = 'assets/miner_pier.png';
})();

// Six purpose-made angle-bucket poses for the player figure (superseding
// the single-pose cutout + dampened-rotation approximation this shipped
// with initially) -- a real equivalent to the old SPR.figImg aim-bucket
// sprite sheet, but as separate clean-cutout PNGs. anchorX/anchorY is each
// image's own planted-foot point (measured per-file, since each was
// individually cropped to its content and framing isn't consistent across
// the set). angle is this bucket's position across the game's actual
// 8-88 aim range, assigned by the set's naming order (up_soft -> shallowest,
// down_steep -> steepest) rather than back-measuring the art's rendered
// angle, which was too imprecise to trust at this scale.
// renderAngle is that back-measurement anyway (hand-to-tip vector, degrees,
// same convention as sp.angle) -- used only for the small corrective spear
// rotation in drawFigure() below, not for bucket selection. The six poses'
// own baked-in throw angle only spans roughly -14 to +26 degrees regardless
// of which bucket, well short of the game's 8-88 range, so at extreme aim
// angles the weapon reads as barely moving while the reticle sweeps the
// full range -- the correction closes part of that gap without the whole
// body swinging (capped, see drawFigure()).
const PLAYER_FIG_SPECS = [
  { file:'assets/figure_up_soft.png',   angle:8,  anchorX:195, anchorY:375, renderAngle:-14 },
  { file:'assets/figure_level.png',     angle:24, anchorX:212, anchorY:363, renderAngle:-3 },
  { file:'assets/figure_down_soft.png', angle:40, anchorX:222, anchorY:360, renderAngle:7 },
  { file:'assets/figure_down_mid.png',  angle:56, anchorX:205, anchorY:352, renderAngle:16 },
  { file:'assets/figure_down_hard.png', angle:72, anchorX:162, anchorY:347, renderAngle:24 },
  { file:'assets/figure_down_steep.png',angle:88, anchorX:197, anchorY:352, renderAngle:26 },
];
const PLAYER_FIG_BUCKETS = [];
(function loadPlayerFigBuckets(){
  PLAYER_FIG_SPECS.forEach((spec, i) => {
    const img = new Image();
    img.onload = () => { PLAYER_FIG_BUCKETS[i] = Object.assign({ img }, spec); };
    img.src = spec.file;
  });
})();
function nearestPlayerFigBucket(angleDeg){
  let best = null, bd = Infinity;
  for (const b of PLAYER_FIG_BUCKETS){
    if (!b) continue;
    const d = Math.abs(b.angle - angleDeg);
    if (d < bd){ bd = d; best = b; }
  }
  return best;
}

// v7.3: real wind-up/release/recovery animation for the player, extracted
// from the same Firefly clip set as the five miner skins (see MINER_ANIM
// above for the shared pipeline). Unlike the miners, this ONLY covers
// COCKED/FLIGHT/RECOVERING -- IDLE keeps the six PLAYER_FIG_BUCKETS above
// entirely unchanged, since those already read well across the full 8-88
// degree aim range and this clip only shows the throw at one angle.
// That one-angle limitation is the real constraint here: the source
// footage's own baked throw direction measures ~8 degrees (shoulder-to
// -hand-tip on the release frame), matching PLAYER_FIG_SPECS' shallowest
// bucket almost exactly, so the same corrective-rotation trick already
// proven for the idle buckets (clamped +-20deg, see PLAYER_FIG_SPECS'
// comment) is reused here too -- reasonable near that shallow end, honestly
// roughest at the steep end (72-88deg) where the correction caps out well
// short of the true angle, same style of approximation as the system it
// extends, not a new risk.
// wind: keyed by charge (0..1), same bucket-by-fraction idea as MINER_ANIM's
// m.arm. release: a single held pose (empty hand, mid-lunge) -- FLIGHT can
// last a long time (the real spear is a physics object, drawn separately
// by drawSpear(), same separation-of-concerns as every miner projectile) so
// this is frozen for the whole state rather than animated further.
// recovery: keyed by recovK (0..1, see fire()'s sp.recovTotal and
// drawPlay()'s recovK computation) -- shows the spear actually being

// v4.0: mouse input (GDD "CLAIMJUMPER! v4.0 -- MOUSE + KEYBOARD
// CONTROL SCHEME"). Mouse aims continuously (replacing Up/Down as
// the primary aim control, though Up/Down stays live as a fallback
// -- see updateThrow); click is an additional, faster release
// trigger alongside SPACE-release. Movement/charge stay on the
// keyboard, unchanged (GDD sec 2).
let mouse = { x: 0, y: 0, down: false };
mouse.lx = LW / 2; mouse.ly = LH / 2; // last transformed logical position
function clientToLogical(clientX, clientY){
  // GDD sec 5: must use getBoundingClientRect() (actual displayed
  // size), not a hardcoded divide-by-DRAW_SCALE -- the canvas can be
  // CSS-scaled to a size other than 960x576.
  const r = cv.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height; // canvas-buffer px per displayed px
  const px = (clientX - r.left) * sx;        // 960x576 canvas-buffer coords
  const py = (clientY - r.top) * sy;
  return { x: px / DRAW_SCALE, y: py / DRAW_SCALE }; // 400x240 logical coords
}
cv.addEventListener('mousemove', e => {
  const p = clientToLogical(e.clientX, e.clientY);
  mouse.lx = p.x; mouse.ly = p.y;
  // v4.0 fix: angle is set HERE, on an actual mouse-move event, not
  // recomputed every game tick from a static last-known position.
  // The earlier version recomputed sp.angle from mouse.lx/ly inside
  // updateThrow() unconditionally, every tick -- so on any tick where
  // the mouse hadn't moved, that recompute silently overwrote whatever
  // the arrow keys had just done, snapping angle straight back to the
  // stale mouse-derived value. Net effect: holding an arrow key with
  // the mouse untouched did nothing observable -- keyboard-only aiming
  // was broken. Doing this update only in response to a real mousemove
  // event, and leaving updateThrow to just apply key deltas on top of
  // whatever sp.angle already is, restores "last input wins" for real.
  const sp = G.sp;
  if (sp && !(sp.live || sp.state==='RECOVERING') && !keys['KeyB']){
    const ox = G.playerX + G.shoveX, oy = G.obsY;
    const dx = mouse.lx - (ox+2), dy = mouse.ly - (oy-8);
    sp.angle = clamp(Math.atan2(dy, dx) * (180/Math.PI), 8, 88);
  }
});

  if (e.button !== 0) return; // left click only
  mouse.down = true;

});

// other than a keyboard action) can strand SPACE in a "held" state
// since its keyup may never fire -- treat blur as an all-keys-and-
// mouse-up safety reset, same defensive spirit as the pcall-wrapped
// Playdate update loop.

// audio — WebAudio synth helpers in the same spirit as MAILTO's
// tone()/sweep()/noiseHit(): short square/triangle/sawtooth/noise
// blips, no samples, no dependencies.
let actx = null, soundOn = true;
function initAudio(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } }
function tone(freq, dur, type, gain, when, bus){
  if (!actx || !soundOn) return;
  const t = (when!==undefined) ? when : actx.currentTime;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(gain,0.001), t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(bus||actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sweep(f0, f1, dur, type, gain, when, bus){
  if (!actx || !soundOn) return;
  const t = (when!==undefined) ? when : actx.currentTime;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type || 'sawtooth';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(gain,0.001), t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(bus||actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf = null;
function getNoiseBuffer(){
  if (noiseBuf || !actx) return noiseBuf;
  const n = actx.sampleRate*0.5;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function noiseHit(dur, gain, when, bus, hp){
  if (!actx || !soundOn) return;
  const buf = getNoiseBuffer(); if (!buf) return;
  const t = (when!==undefined) ? when : actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  let node = src;
  if (hp) { const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; node.connect(f); node = f; }
  node.connect(g); g.connect(bus||actx.destination);
  src.start(t); src.stop(t+dur+0.02);
}

function updateFish(f){
  const s = f.s;
  const L = POOL_L+10, R = G.w.poolR-10;
  const top = WATER_Y+s.band[0], bot = WATER_Y+s.band[1];
  if (s.mode==='dart'){
    f.turn -= 1;
    if (f.turn<=0){ f.turn=irnd(30,60); f.vx=(Math.random()<0.5?-1:1)*s.spd*rnd(0.6,1.3); f.vy=rnd(-0.5,0.5); }
  } else if (s.mode==='hold'){
    f.vx *= 0.94; f.vy *= 0.9;
    f.burst -= 1;
    if (f.burst<=0){ f.burst=irnd(200,420); f.vx=(Math.random()<0.5?-1:1)*s.spd*7; }
    if (f.fy < bot-6) f.vy += 0.05;
  } else if (s.mode==='cruise'){
    f.burst -= 1;
    if (f.burst<=0){ f.burst=irnd(150,300); f.vx=(f.vx>=0?1:-1)*s.spd*4; }
    f.vx = lerp(f.vx, (f.vx>=0?1:-1)*s.spd, 0.06);
    if (f.run>0) { f.run -= 1; f.vx = 2.2; }
    else if (Math.random()<0.0022 && G.mode==='PLAY') f.run = 200;
  } else if (s.mode==='probe'){
    const tx = lerp(L,R,0.5), ty = f.fy;
    f.vx = lerp(f.vx, (tx-f.fx)>=0?s.spd:-s.spd, 0.08);
    f.vy = lerp(f.vy, clamp((ty-f.fy)*0.05,-1.4,1.4), 0.1);
  }
  f.fx += f.vx; f.fy += f.vy;
  if (f.fx<L) { f.fx=L; f.vx=Math.abs(f.vx); }
  if (f.fx>R) { f.fx=R; f.vx=-Math.abs(f.vx); }
  if (f.fy<top) { f.fy=top; f.vy=Math.abs(f.vy)*0.5; }
  if (f.fy>bot) { f.fy=bot; f.vy=-Math.abs(f.vy)*0.5; }
  f.escT -= 1;
  if (f.escT<=0){
    f.escT = 150;
    if (Math.random() < f.s.esc){ f.dead=true; f.escaped=true; if (G.mode==='PLAY') sfxEscape(); }
  }
}

// ---------------------------------------------------------------
// v2: platform movement (GDD §3) — cannot move while braced or
// recovering; moving costs balance on top of the passive drain.
// v3.0: COCKED (charging) no longer locks movement -- this was the main
// source of "can't dodge" clunkiness: a charge can be held for well over a
// second, and a rock thrown at you during that whole window was previously
// undodgeable no matter how it was aimed. Shuffling your feet while winding
// up a throw is a normal thing to be able to do; RECOVERING (the brief
// post-throw stagger, 7-14 ticks depending on power) and bracing stay
// locked -- those are shorter and are meant to carry real risk.
function updateMovement(){
  const sp = G.sp;
  const locked = sp.state==='RECOVERING' || !!keys['KeyB'];
  let moving = false;
  if (!locked){
    if (keys['ArrowLeft'] || keys['KeyA']) { G.playerX -= MOVE_SPEED; G.playerVX = -MOVE_SPEED; moving = true; }
    else if (keys['ArrowRight'] || keys['KeyD']) { G.playerX += MOVE_SPEED; G.playerVX = MOVE_SPEED; moving = true; }
    else G.playerVX = 0;
  } else {
    G.playerVX = 0;
  }
  G.playerX = clamp(G.playerX, PLAYER_MIN, PLAYER_MAX);
  return moving;
}

// ---------------------------------------------------------------
// throw / spear flight (ported from updateThrow/fire/updateSpearFlight)
function updateThrow(dt){
  const sp = G.sp;
  const braced = !!keys['KeyB'];

  // v4.0: mouse aim is applied event-driven, in the mousemove listener
  // itself (see above) -- NOT recomputed here every tick. Recomputing
  // it here unconditionally from mouse.lx/ly on every tick was the
  // original bug: it silently overwrote any angle change the arrow
  // keys had just made on ticks where the mouse hadn't moved, which
  // is every tick for a keyboard-only player. Up/Down/W/S below is
  // now the only thing that touches sp.angle inside the tick loop;
  // the mouse listener owns the rest. Last-input-wins still holds,
  // it just happens naturally now: whichever of "a key was pressed
  // this tick" or "the mouse moved since the last tick" happened most
  // recently is what's reflected in sp.angle.
  if (keys['ArrowUp']   || keys['KeyW']) sp.angle -= ANGLE_RATE*dt;
  if (keys['ArrowDown'] || keys['KeyS']) sp.angle += ANGLE_RATE*dt;
  sp.angle = clamp(sp.angle, 8, 88);

  if (sp.live || sp.state==='RECOVERING'){ sp.charge=0; return; }
  if (braced){ sp.charge=0; sp.state='IDLE'; return; }

  // v4.0.1: originally SPACE alone charged, and a mouse click was only
  // wired up as a faster *release* trigger for a throw already cocked
  // by holding SPACE -- so clicking with SPACE untouched was correctly
  // a no-op, but that meant a mouse-only player could never actually
  // start a throw. Per direction, mouse and keyboard are now fully
  // interchangeable for the whole charge/release gesture: holding
  // EITHER SPACE or the mouse button climbs the charge and cocks the
  // spear; releasing BOTH (neither is held anymore) fires at whatever
  // charge was reached. This is deliberately symmetric with how
  // Up/Down and mouse-aim coexist elsewhere in this file -- whichever
  // input the player is actually using just works, with no mode to
  // pick and no keyboard-only "primary" input.
  const chargeInputDown = !!keys['Space'] || mouse.down;
  if (chargeInputDown){
    sp.state = 'COCKED';
    sp.charge = clamp(sp.charge + dt/chargeTime(), 0, 1);
  } else if (sp.state==='COCKED'){
    fire(sp.charge);
  }
}
function fire(power){
  const sp = G.sp;
  sp.charge = 0;
  if (power < MIN_POWER){
    G.stuck = { x:G.playerX+14, y:WATER_Y+8, t:24 };
    sp.state='RECOVERING'; sp.recov=7; sp.recovTotal=7;
    sfxFizzle();
    G.streak = 0; // fizzles count as a miss (GDD §5.2)
    return;
  }
  const err = clamp((1-power)*4, 0, 4);
  const a = clamp(sp.angle + rnd(-err,err), 6, 88);
  let [depth, range, recov] = powerBand(power);
  sp.power = power;
  sp.x = G.playerX+G.shoveX+4; sp.y = G.obsY-2;
  sp.vx = Math.cos(a*D2R)*14; sp.vy = Math.sin(a*D2R)*14; // faster flight (was 9); the spear still moves in 3 sub-steps per tick, so nothing is skipped
  sp.uw = 0; sp.splashed=false; sp.uwRange=range; sp.maxDepth=depth;
  sp.live=true; sp.recov=recov; sp.recovTotal=recov; sp.state='FLIGHT'; sp.flightTicks=0;
}
function endFlight(x,y,stick,isMiss){
  const sp = G.sp;
  sp.live=false;
  sp.state='RECOVERING';
  if (stick) G.stuck = {x,y,t:40};
  if (isMiss) G.streak = 0;
}

// --- v2: repair paths (GDD §5) ---
function handleStreak(){
  if (G.streak===5){ G.condition=Math.min(4,G.condition+1); G.banner={text:'DEAD EYE \u2014 5', t:50}; sfxStreak(); }
  else if (G.streak===8){ G.condition=Math.min(4,G.condition+1); G.lives+=1; G.banner={text:'UNERRING \u2014 8', t:50}; sfxStreak(); }
  else if (G.streak>8 && (G.streak-8)%4===0){ G.condition=Math.min(4,G.condition+1); G.banner={text:'STREAK '+G.streak, t:50}; sfxStreak(); }
}

function updateDrops(){
  const keep=[];
  for (const d of G.drops){
    d.t += 1;
    if (d.t >= d.dur) continue;
    keep.push(d);
  }
  G.drops = keep;
}

function catchFish(f){
  const sp = G.sp;
  f.dead = true;
  const k = f.s.key;
  G.cache[k] = (G.cache[k]||0)+1;
  G.total[k] = (G.total[k]||0)+1;
  if (k==='steelhead' && G.condition < 4){
    G.condition = Math.min(4, G.condition+1);
    G.banner = {text:'PATCHED UP', t:50};
    sfxPatched();
  }
  G.hitFlash = {x:f.fx, y:f.fy, t:10};
  (G.flyFish = G.flyFish || []).push({ key:k, x:f.fx, y:f.fy, t:0, dur:34 }); // floats up into the HUD stack
  sp.live=false;
  sp.state='RECOVERING';
  sfxCatch(f.s.freq, f.s.hdur);
  if (k==='steelhead') sfxCatchExtra(f.s.freq);
  G.catchFlash = {name:f.s.name, t:42};
  if (!G.seen[k]){ G.seen[k]=true; G.newlySeen.push(k); }
  G.streak += 1;
  handleStreak();
}
function updateSpearFlight(){
  const sp = G.sp;
  if (!sp.live) return;
  const steps = 3;
  for (let i=0;i<steps;i++){
    sp.x += sp.vx/steps; sp.y += sp.vy/steps;
    const under = sp.y > WATER_Y;
    if (under) sp.uw += Math.sqrt(sp.vx*sp.vx+sp.vy*sp.vy)/steps;

    if (!under && sp.x > BANK_X-8){
      for (const m of G.miners){
        // v3.0.1: this range was sized for the old ~19-24px vector body
        // (WATER_Y-20 to WATER_Y+2, +-9px horizontal) and never updated when
        // the miner became a sprite standing roughly 50-56px tall -- so the
        // spear could only ever register a hit against his ankles, and
        // everything above that (which is most of his visible silhouette:
        // torso, raised throwing arm, head) never counted. Widened to cover
        // the sprite's actual drawn height, generous enough for the taller
        // vinegar miner too since this check doesn't split by type.
        if (m.state!=='gone' && Math.abs(m.x-sp.x)<15 && sp.y>WATER_Y-56 && sp.y<WATER_Y+6){
          const wasVinegar = m.type==='vinegar';
          let goneT = (m.type==='jumper') ? 450 : 360;
          m.state='gone'; m.t = goneT;
          G.minerHit = {x:m.x, y:WATER_Y-10, t:16};
          sfxMinerHit();
          G.minersSpeared += 1;
          G.minersSpearedWave += 1;
          if (wasVinegar){
            // GDD §7.3: spearing the vinegar miner first is the big reward
            G.vinegarKilled = true;
            G.condition = Math.min(4, G.condition+1);
            G.lives += 1;
            G.banner = {text:'VINEGAR MINER DOWN', t:60};
            sfxExtend();
          }
          endFlight(sp.x, sp.y, false, false); // doesn't break streak, doesn't advance it
          return;
        }
      }
    }
    if (under){
      sp.splashed = true;
      for (const f of G.fish){
        if (!f.dead){
          const dx=f.fx-sp.x, dy=f.fy-sp.y;
          const rad = 9+f.s.len*0.45;
          if (Math.sqrt(dx*dx+dy*dy) < rad){ catchFish(f); return; }
        }
      }
      if (sp.uw >= sp.uwRange || (sp.y-WATER_Y) >= sp.maxDepth || sp.y > BOT_Y-2){
        endFlight(sp.x, Math.min(sp.y, BOT_Y-2), true, true); return;
      }
    }
    if (sp.x > 398 || sp.y > BOT_Y+24){ endFlight(sp.x, sp.y, false, true); return; }
  }
}

// v7 GDD §1.2: wave-gated skin pool for rock-spawn miners (verbatim table
// -- waves 1-2 Rock-Thrower only, 3-4 add Archer, 5-6 add Prospector).
// G.wave progresses globally across the run, not per-stage, and once a
// skin is introduced it stays in the pool.
function rockSkinPool(){
  // Period-specific: no white enemies before the 1862 gold rush (wave 3).
  if (G.wave<=1) return ['rockthrower'];
  if (G.wave<=2) return ['rockthrower','archer'];
  return ['rockthrower','archer','prospector'];
}

// ---------------------------------------------------------------
// miners (ported from spawnMiner/throwRock/takeFish/updateMiners/updateRocks)
function spawnMiner(){
  if (G.miners.length >= 4) return;
  let rocks = 0;
  for (const m of G.miners) if (m.type==='rock' && m.state!=='gone') rocks++;
  // v7 §4: the 'jumper' (rival-angler) miner is explicitly out of scope
  // for the skin system -- only 'rock' miners get a skin.
  const kind = (rocks>=2) ? 'jumper' : (Math.random()<0.6 ? 'rock' : 'jumper');
  // v7.1: these ranges used to be fixed absolute x (356-392 / 352-372),
  // tuned around the pier's old fixed x~370. Once startWave() started
  // rolling a random G.pierCx per wave (+-15px), the miner's spawn/stand
  // point stopped tracking the pier's actual position -- the miner would
  // walk to a fixed spot near the OLD pier location regardless of where
  // that wave's pier actually rendered, reading as floating off the
  // structure on any wave whose roll moved the pier. Now relative to
  // G.pierCx, same spread as before.
  const tx = G.pierCx + ((kind==='rock') ? rnd(-14,22) : rnd(-18,2));
  const pool = rockSkinPool();
  const skin = (kind==='rock') ? pool[irnd(0,pool.length-1)] : null;
  G.miners.push({ type:kind, x:G.pierCx+52, tx, state:'walk', t:0, arm:0, skin });
}
// --- v2: the vinegar miner (GDD §7) ---
function maybeSpawnVinegar(){
  if (G.wave===G.vinegarWave && !G.vinegarSpawned && G.spawned >= G.w.target/2){
    G.vinegarSpawned = true;
    return true;
  }
  if (G.wave===WAVES.length && G.vinegarSpawned && G.vinegarSecondPlanned && !G.vinegarSecondUsed){
    G.vinegarSecondUsed = true;
    return true;
  }
  return false;
}
function spawnVinegarMiner(){
  if (G.miners.length >= 4) return;
  // v7 §1.1: Miner/Soldier is the sole skin on the vinegar-spawn behavior.
  // v7.1: tx/x relative to G.pierCx, same reasoning as spawnMiner() above.
  G.miners.push({ type:'vinegar', x:G.pierCx+52, tx: G.pierCx+rnd(-18,2), state:'walk', t:0, arm:0, skin:'soldier' });
  G.banner = {text:'SOMETHING IN HIS HAND CATCHES THE LIGHT', t:45};
  sfxVinegarSpawn();
}
// v2: rocks (and the vinegar bottle) lead the player instead of
// targeting a fixed point (GDD §3.4) — early miners throw where you
// are, late miners throw where you're going.
function computeTargetX(){
  const idx = G.wave-1;
  const leadAcc = lerp(0.3, 0.8, idx/(WAVES.length-1));
  const scatter = lerp(10, 4, idx/(WAVES.length-1));
  return G.playerX + G.playerVX*10*leadAcc + rnd(-scatter, scatter);
}
// v3.0: an explicit, readable miss chance -- separate from the scatter
// above. Scatter alone rarely produced a real miss: it's only 4-10px of
// jitter against a ~26px-wide hitbox, so a stationary player was hit almost
// every time regardless. This rolls a flat per-throw chance (eases from
// 26% on wave 1 to 12% on the final wave, same difficulty direction as the existing
// scatter/lead curves) and, when it triggers, sends the throw well clear of
// the platform's dodge range entirely -- a genuine "he missed" moment, not
// just a smaller random wobble.
function rollThrowMiss(){
  const idx = G.wave-1;
  return Math.random() < lerp(0.26, 0.12, idx/(WAVES.length-1));
}
function missTargetX(){
  const dir = Math.random()<0.5 ? -1 : 1;
  return G.playerX + dir*rnd(24,36);
}
function throwRock(m){
  // v7 §1.3: Archer gets a distinct flatter/faster arc -- shorter flight,
  // less gravity drop -- rather than reusing the rock's lob. Prospector
  // (§1.4) is a plain rock-hit equivalent, so it keeps the rock's arc.
  const archer = m.skin==='archer';
  const T = archer ? 26 : 42, g = archer ? 0.20 : 0.36;
  const tx = rollThrowMiss()
    ? clamp(missTargetX(), PLAYER_MIN-44, PLAYER_MAX+44)
    : clamp(computeTargetX(), PLAYER_MIN-6, PLAYER_MAX+6);
  const ty=G.obsY-2;
  const x=m.x-4, y=WATER_Y-16;
  G.rocks.push({ x, y, vx:(tx-x)/T, vy:(ty-y)/T-0.5*g*T, g, skin:m.skin });
}
function throwBottle(m){
  const T=50, g=0.30; // slightly slower flight than a rock (GDD §7.2)
  const tx = rollThrowMiss()
    ? clamp(missTargetX(), PLAYER_MIN-44, PLAYER_MAX+44)
    : clamp(computeTargetX(), PLAYER_MIN-6, PLAYER_MAX+6);
  const ty=G.obsY-2;
  const x=m.x-4, y=WATER_Y-16;
  G.rocks.push({ x, y, vx:(tx-x)/T, vy:(ty-y)/T-0.5*g*T, g, kind:'vinegar', rot:0 });
}
function takeFish(m){
  const live = G.fish.filter(f=>!f.dead);
  if (!live.length) return;
  live.sort((a,b)=>Math.abs(a.fx-m.x)-Math.abs(b.fx-m.x));
  const f = live[0];
  f.dead = true;
  G.taken.push({ x:f.fx, y:f.fy, tx:m.x, s:f.s, t:0 });
  (m.stolen = m.stolen || []).push(f.s.key); // each stolen fish joins his string
  if (m.stolen.length > 7) m.stolen.shift();
}
function updateMiners(){
  G.minerTimer -= 1;
  if (G.minerTimer <= 0){
    if (maybeSpawnVinegar()) spawnVinegarMiner();
    else spawnMiner();
    G.minerTimer = irnd(G.w.gap[0],G.w.gap[1])*30;
  }
  for (const m of G.miners){
    if (m.state==='gone'){
      // v7.1: was the fixed x=404 -- same G.pierCx-tracking fix as the
      // initial spawn in spawnMiner()/spawnVinegarMiner(), for a miner
      // re-entering after retreating offscreen.
      m.t -= 1; if (m.t<=0){ m.state='walk'; m.x=G.pierCx+52; m.stolen=[]; }
    } else if (m.state==='walk'){
      m.x -= (m.type==='vinegar') ? 0.6 : 0.9; // vinegar miner approaches slower (GDD §6.3)
      if (m.x <= m.tx){
        m.state='stand';
        m.t = (m.type==='rock') ? 40 : (m.type==='vinegar' ? 55 : 110);
      }
    } else if (m.type==='rock'){
      if (m.state==='stand'){
        m.t -= 1;
        if (m.t<=0){ m.state='wind'; m.t=45; sfxMinerWind(); }
      } else if (m.state==='wind'){
        m.arm = 1-(m.t/45);
        m.t -= 1;
        if (m.t<=0){
          throwRock(m);
          // v7.3: a brief release-animation window for skins with one (see
          // MINER_ANIM) before settling back to 'stand' -- the projectile
          // still fires at this exact instant, same as before; this only
          // changes what's drawn for a few extra ticks, not when the rock
          // actually becomes a threat.
          const anim = MINER_ANIM[m.skin];
          if (anim && anim.ready && anim.release.length){
            m.state='release'; m.releaseFrame=0; m.t=anim.release.length;
          } else {
            m.state='stand'; m.t=irnd(90,140); m.arm=0;
          }
        }
      } else if (m.state==='release'){
        const n = MINER_ANIM[m.skin].release.length;
        m.releaseFrame = n - m.t;
        m.t -= 1;
        if (m.t<=0){ m.state='stand'; m.t=irnd(90,140); m.arm=0; }
      }
    } else if (m.type==='vinegar'){
      if (m.state==='stand'){
        m.t -= 1;
        if (m.t<=0){ m.state='wind'; m.t=75; sfxVinegarWind(); } // GDD §7.2: 75-frame windup
      } else if (m.state==='wind'){
        m.arm = 1-(m.t/75);
        m.t -= 1;
        if (m.t<=0){
          throwBottle(m);
          // v7.3: same brief release-animation window as the rock-type
          // branch above, for skins with one -- see MINER_ANIM.
          const anim = MINER_ANIM[m.skin];
          if (anim && anim.ready && anim.release.length){
            m.state='release'; m.releaseFrame=0; m.t=anim.release.length;
          } else {
            m.state='stand'; m.t=irnd(90,140); m.arm=0;
          }
        }
      } else if (m.state==='release'){
        const n = MINER_ANIM[m.skin].release.length;
        m.releaseFrame = n - m.t;
        m.t -= 1;
        if (m.t<=0){ m.state='stand'; m.t=irnd(90,140); m.arm=0; }
      }
    } else { // jumper
      if (m.state==='stand'){
        m.t -= 1;
        if (m.t<=0){ m.t=180; takeFish(m); }
      }
    }
  }
}
function updateRocks(){
  const braced = !!keys['KeyB'];
  const keep = [];
  for (const r of G.rocks){
    r.vy += r.g; r.x += r.vx; r.y += r.vy;
    let hit = false;
    if (r.x < G.playerX+16 && r.x > G.playerX-10 && r.y > G.obsY-14 && r.y < G.obsY+16){
      hit = true;
      if (r.kind==='vinegar'){
        onVinegarHit(); // brace does NOT help (GDD §7.3)
      } else if (!braced){
        G.condition -= 1;
        G.shoveX = -rnd(6,10); G.shoveT = 30;
        G.portraitFlinch = 12;
        sfxRockHit();
        const sp = G.sp;
        if (sp.state==='COCKED') { sp.charge = Math.max(0, sp.charge*0.4); }
        if (G.condition<=0) onLifeLost('knocked');
      }
      // v4.4: bracing now blocks a rock hit outright, free -- it used to
      // cost 8 BALANCE instead of a heart, but BALANCE (and the movement/
      // throw-cost resistance that went with it) was removed entirely per
      // direction, in favor of a purely arcade slide-and-shoot feel. There
      // was no other price for bracing, so it's simply a clean block now.
    }
    if (r.y > LH+10 || r.x < -10) hit = true;
    if (!hit) keep.push(r);
  }
  G.rocks = keep;
}

// --- v2: lives / life-lost handling (GDD §1) ---
function onVinegarHit(){
  G.condition = 0;
  G.shoveX = -rnd(6,10); G.shoveT = 30;
  onLifeLost('vinegar');
}
function onLifeLost(kind){
  if (G.mode !== 'PLAY') return; // guard against double-trigger in one tick
  G.lives -= 1;
  G.livesUsed += 1;
  G.fallKind = kind;
  G.streak = 0;
  G.mode = 'LIFELOST'; G.fallT = 0;
  if (kind==='vinegar') sfxVinegarHit();
  else if (kind==='knocked') sfxKnocked();
  else sfxFall();
}

// ---------------------------------------------------------------
// phase update — 30 ticks/sec, matching the Playdate build's fixed
// 30fps refresh rate exactly (see main loop below), so every frame
// count and per-frame constant above carries over unchanged.
const TICK_DT = 1/30;
function updatePlay(){
  const dt = TICK_DT;
  if (G.catchFlash){ G.catchFlash.t -= 1; if (G.catchFlash.t<=0) G.catchFlash=null; }
  if (G.shoveT>0){ G.shoveT -= 1; if (G.shoveT<=0) G.shoveX=0; }
  if (G.portraitFlinch>0) G.portraitFlinch -= 1;

  if (G.spawned < G.w.target){
    G.spawnTimer -= 1;
    if (G.spawnTimer<=0){ G.fish.push(spawnFish()); G.spawned += 1; G.spawnTimer = 55 + Math.floor(G.t/50); }
  }

  const keep = [];
  for (const f of G.fish){
    if (!f.dead){
      updateFish(f);
      if (!f.dead) keep.push(f);
    }
  }
  G.fish = keep;

  G.playerMoving = updateMovement();
  updateThrow(dt);
  if (G.sp.live) { G.sp.flightTicks = (G.sp.flightTicks||0) + 1; updateSpearFlight(); }
  else if (G.sp.state==='RECOVERING'){
    G.sp.recov -= 1;
    if (G.sp.recov<=0){ G.sp.state='IDLE'; G.sp.charge=0; }
  }

  updateMiners();
  updateRocks();
  updateDrops();

  G.condition = clamp(G.condition, 0, 4);

  if (G.stuck){ G.stuck.t -= 1; if (G.stuck.t<=0) G.stuck=null; }
  if (G.hitFlash){ G.hitFlash.t -= 1; if (G.hitFlash.t<=0) G.hitFlash=null; }
  if (G.minerHit){ G.minerHit.t -= 1; if (G.minerHit.t<=0) G.minerHit=null; }
  if (G.banner){ G.banner.t -= 1; if (G.banner.t<=0) G.banner=null; }
  G.taken = G.taken.filter(t => { t.t += 1; return t.t < 50; });
  G.flyFish = (G.flyFish || []).filter(f => { f.t += 1; return f.t < f.dur; });

  if (G.spawned>=G.w.target && G.fish.length===0){
    sfxWaveClear();
    enterTally();
  }
}

// ---------------------------------------------------------------
// text helpers
// v4.2: legibility pass. ctext/rtext/wrapText previously did a flat
// single-color fillText with no contrast strategy at all -- fine over
// the light sky, but they land over the canyon rock and water too,
// which are similar dark/mid-brown values to the ink/muted-brown fills
// already in use everywhere, so text would sometimes nearly disappear
// into the background behind it. boldCText (below) already solved this
// for headline text with a soft shadow + stroke, specifically so text
// could read against the open painted scene without needing a plate/
// box behind it (boxes were deliberately removed in an earlier pass
// for feeling cramped -- not reintroducing them here). This extends
// the same no-box idea down to every other piece of HUD/label text: a
// light halo stroked behind the fill, so whatever fill color a call
// site chooses (ink, or one of the muted secondary browns) stays
// legible over light sky, dark canyon rock, or water alike. Harmless
// over the ending sequence's plate() cards and the dark life-lost/
// continue scrims too -- the halo just reads as a soft edge there.
function haloText(s, x, y, align, opt){
  ctx.save();
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = (opt&&opt.font) || '13px Georgia';
  ctx.lineJoin = 'round';
  ctx.lineWidth = (opt&&opt.haloWidth) || 2.6;
  ctx.strokeStyle = (opt&&opt.halo) || 'rgba(242,234,216,0.88)';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = (opt&&opt.color) || '#2b1d10';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function ctext(s, y, opt){ haloText(s, LW/2, y, 'center', opt); }
function rtext(s, rightX, y, opt){ haloText(s, rightX, y, 'right', opt); }
// bold headline text, embossed the way MAILTO's actual title screen
// does it (dark offset shadow + main fill + gold stroke), using a
// real bold canvas font.
function boldCText(s, y, size){
  size = size || 26;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `bold ${size}px Georgia`;
  ctx.fillStyle = 'rgba(30,18,8,0.45)';
  ctx.fillText(s, LW/2+1, y+1.4);
  ctx.fillStyle = '#2b1d10';
  ctx.fillText(s, LW/2, y);
  ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(232,178,60,0.55)';
  ctx.strokeText(s, LW/2, y);
  ctx.restore();
}
function wrapText(s, cx, y, maxW, lh, opt){
  ctx.save();
  ctx.textAlign='center'; ctx.font = (opt&&opt.font) || '11px Georgia';
  ctx.lineJoin = 'round';
  ctx.lineWidth = (opt&&opt.haloWidth) || 2.4;
  ctx.strokeStyle = (opt&&opt.halo) || 'rgba(242,234,216,0.88)';
  const fill = (opt&&opt.color) || '#4a3a26';
  const words = s.split(' ');
  let line='', ly=y;
  for (const w of words){
    const test = line+w+' ';
    if (ctx.measureText(test).width>maxW && line){
      ctx.strokeText(line.trim(), cx, ly); ctx.fillStyle = fill; ctx.fillText(line.trim(), cx, ly);
      line=w+' '; ly+=lh;
    } else line = test;
  }
  ctx.strokeText(line.trim(), cx, ly); ctx.fillStyle = fill; ctx.fillText(line.trim(), cx, ly);
  ctx.restore();
}
function dashedLine(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, d=Math.sqrt(dx*dx+dy*dy);
  if (d<1) return;
  const ux=dx/d, uy=dy/d, step=6;
  ctx.beginPath();
  for (let t=0; t<d; t+=step){
    const a = Math.min(t+3,d);
    ctx.moveTo(x1+ux*t, y1+uy*t); ctx.lineTo(x1+ux*a, y1+uy*a);
  }
  ctx.stroke();
}

// ---------------------------------------------------------------
// palette — MAILTO!'s actual warm earthy hex family. v2 adds two
// colours: bloodDk (portrait damage only) and glassGrn (the vinegar
// bottle), per GDD §6.4 — no other new colours.
const PAL = {
  ink:'#2b1d10', cream:'#f2ead8', gold:'#e8b23c', gold2:'#e8d24a',
  rockDk:'#3a2a1c', rockMd:'#6b4a2a', rockLt:'#8a6338',
  waterDp:'#2f5064', waterLt:'#5c93ab', waterFoam:'rgba(242,234,216,0.5)',
  sky1:'#e8c896', sky2:'#f0d9a8', sky3:'#f6ecc8',
  wood:'#6b4a2a', woodDk:'#4a3018',
  bloodDk:'#7a2418', glassGrn:'#4a6b52',
};

// ---------------------------------------------------------------
// scene drawing (ported from drawCanyon/drawWater/drawFishShape/
// drawSpear/drawMiner/drawPlay etc, redrawn with MAILTO's actual
// paint-facet technique instead of Playdate's 1-bit line/fill calls)
function drawSky(){
  // v3.0.4: draws the WHOLE scene now, not just the upper band -- a single
  // cohesive backdrop (canyon wall, rapids, water, all in their real
  // relative proportions) covering the full canvas, called first in every
  // screen's draw order so drawWater/drawBank/drawPlatform layer on top of
  // it. Replaces the earlier pass's separate sky-only and water-only
  // stretched fills, which were "blown out of perspective" -- each piece
  // stretched independently distorted the scene's actual proportions. This
  // is one image at one uniform scale (the source crop's aspect ratio was
  // chosen to exactly match LW:LH, so there's no stretch in either axis).
  // Per-wave background stills, now the live PLAY scene too (not just the
  // WAVEINTRO card) -- each stage gets its own real backdrop rather than
  // one fixed scene throughout. Checked before SPR.sceneImg so it takes
  // over the exact same "whole scene in one image" role.
  const bg = waveBackdrop();
  if (bg){
    ctx.drawImage(bg, 0, 0, LW, LH);
    return;
  }
  if (SPR.ready && SPR.sceneImg){
    ctx.drawImage(SPR.sceneImg, 0, 0, LW, LH);
    return;
  }
  const g = ctx.createLinearGradient(0,0,0,WATER_Y);
  g.addColorStop(0, PAL.sky1); g.addColorStop(0.5, PAL.sky2); g.addColorStop(1, PAL.sky3);
  ctx.fillStyle = g; ctx.fillRect(0,0,LW,WATER_Y+4);
}
function drawCanyonWalls(){
  // Skip the corner rock-wall accent over a per-wave photo backdrop -- it
  // was shaped to complement the original scene's specific composition and
  // would just sit as a mismatched wedge over these.
  if (waveBackdrop()) return;
  ctx.fillStyle = PAL.rockMd;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(46,0); ctx.lineTo(20,38); ctx.lineTo(0,34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(20,0); ctx.lineTo(8,20); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAL.rockMd;
  ctx.beginPath(); ctx.moveTo(LW,0); ctx.lineTo(LW-30,0); ctx.lineTo(LW-10,30); ctx.lineTo(LW,28); ctx.closePath(); ctx.fill();
}
// v3.0.4: BG_SCALE and the standalone pool-image fill are unused now --
// drawSky() draws the whole scene (including water) in one pass, so
// drawWater() only needs to add the animated ripple/glints on top. Left
// defined/intact rather than deleted in case a future pass wants a
// dedicated water-only asset again.
const BG_SCALE = 0.30;
function drawWater(l, r, top, bot, t){
  if (waveBackdrop() || (SPR.ready && SPR.sceneImg)){
    // scene backdrop already painted this region; nothing to fill
  } else if (SPR.ready && SPR.poolImg){
    ctx.drawImage(SPR.poolImg, l, top, r-l, bot-top);
  } else {
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, PAL.waterLt); g.addColorStop(1, PAL.waterDp);
    ctx.fillStyle = g;
    ctx.fillRect(l, top, r-l, bot-top);
  }
  // rippled surface line, painted not just stroked flat
  ctx.strokeStyle = PAL.waterFoam; ctx.lineWidth = 1.2;
  ctx.beginPath();
  let prevx=null, prevy=0;
  for (let x=l; x<=r; x+=3){
    const y = top + Math.sin(x*0.11 + t*0.09)*1.2;
    if (prevx!==null) { ctx.moveTo(prevx,prevy); ctx.lineTo(x,y); }
    prevx=x; prevy=y;
  }
  ctx.stroke();
  // faint scattered glints
  for (let i=0;i<10;i++){
    const gx = l + ((i*97 + Math.floor(t*0.6)) % Math.max(1,(r-l)));
    const gy = top + 6 + ((i*53) % Math.max(1,(bot-top-12)));
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(gx, gy, 3, 1);
  }
}
function drawBank(l, top, w, h){
  ctx.fillStyle = PAL.rockLt;
  ctx.fillRect(l, top, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(l, top, w, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(l, top+h-4, w, 4);
}

// v5: static miner pier/deck, drawn every frame regardless of whether a
// miner is present, so the player can see where enemies will spawn and
// stand before they engage. Originally scoped as a crop-and-composite
// from the miner sprite sheet (WHITE_GUY.MP4 footage) per the GDD's
// preferred approach (a) -- but direct inspection of that sheet found
// the pier isn't actually a consistent static structure to crop: the
// walk-cycle frames (0-5) each carry a different, much larger chunk of
// baked-in background (dock, ropes, water) from a moving source shot,
// and even the "stand"/"bend" frames' own simple plank+post structure
// has the miner's boots occluding the plank at exactly the point a
// static crop would need it clean. No single frame yields an isolated,
// reusable pier asset. Falling back to approach (b) instead: a flat
// procedural platform in the same vector-plank language drawPlatform's
// own fallback already uses (same PAL.wood/woodDk palette), sized to
// the miner spawn/stand x-range (rock tx: G.pierCx-14..+22, jumper/vinegar
// tx: G.pierCx-18..+2 -- see spawnMiner/spawnVinegarMiner). Reworking the miner
// sprite itself is out of scope here (GDD §4.4).
function drawMinerPier(){
  // Real reference art for the miners' spawn pier, replacing the earlier
  // procedural plank-and-legs. Anchored at the plank's near top corner
  // (where a miner would stand), centered on the same x the old procedural
  // pier occupied.
  if (PLAYER_ART.pier){
    const img = PLAYER_ART.pier;
    // v7.2: replaced the low-detail reference-photo crop with a proper
    // Firefly-generated dock (same source-art quality tier as the skins),
    // background-removed locally (Firefly exported a picture of a
    // checkerboard, not real alpha -- see NEW_GAME_GUIDE.md/DESIGN.md).
    // anchorX/anchorY re-measured the same empirical way as the old
    // anchorY=68 fix: the front post's plank surface, which needs to land
    // at WATER_Y to match drawMinerSkin()/drawMinerSprite()'s feet anchor.
    // Re-measured for the redesigned dock (hoist post at its left end): the deck top
    // is row 108, and the miners stand 150px in so they clear the post.
    const anchorX = 150, anchorY = 108;
    const scale = 0.21;
    // G.pierCx/pierRot: a small per-wave position+tilt roll (see
    // startWave()), same idea as the tower's. Rotated around the plank's
    // own anchor point so the miner (drawn separately at its fixed
    // spawn/stand x) still reads as standing on it at this tilt.
    ctx.save();
    ctx.translate(G.pierCx, WATER_Y);
    ctx.rotate(G.pierRot);
    const postLocalX = -anchorX * scale, postLocalY = -anchorY * scale;
    // v7.2: dropped the reused net-braced tower-leg section that used to
    // continue the post down toward the water. It was cropped from the
    // OLD player tower art being retired this pass, and reading as a
    // second, smaller "fishing tower" sitting on the enemy side of the
    // screen was exactly the visual confusion flagged -- the player's
    // tower should be the only tower-style structure on screen.
    ctx.drawImage(img, postLocalX, postLocalY, img.width * scale, img.height * scale);
    ctx.restore();
    return;
  }
  const l = 338, r = 402, y = WATER_Y;
  ctx.fillStyle = PAL.wood;
  ctx.fillRect(l, y, r-l, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(l, y, r-l, 1);
  ctx.strokeStyle = PAL.woodDk; ctx.lineWidth = 1.2;
  for (let x=l+6; x<r; x+=11){
    ctx.beginPath(); ctx.moveTo(x, y+3); ctx.lineTo(x-3, y+15); ctx.stroke();
  }
}
function drawPlatform(oy){
  // v7.2: replaced the original concept-art tower (photoreal-ish
  // rendering, snow/mountain scene baked into parts of it, and a known
  // ghost-feet crop artifact) with the Firefly-generated tower from the
  // same batch as the skins/pier art, for one consistent art style
  // throughout. Stretched vertically only so its foot-anchor point lands
  // at `oy` and its base reaches down near the water regardless of the
  // current wave's platform height -- same "stack/stretch to fit" idea
  // as the old trestle tiling below, just with one full image instead of
  // a repeated bay unit.
  if (PLAYER_ART.tower){
    const img = PLAYER_ART.tower;
    const anchorX = 220, anchorY = 142; // player's foot point within the art (deck surface)
    const targetBottom = 226; // where the submerged base/splash should land
    const scale = (targetBottom - oy) / (img.height - anchorY);
    const dw = img.width * scale, dh = img.height * scale;
    // G.towerCx/towerRot: a small per-wave position+tilt roll (see
    // startWave()) so the tower doesn't look identical every wave. Rotated
    // around the player's own foot point, not the image center, so the
    // (separately-drawn, unrotated) player figure still lines up with it.
    ctx.save();
    ctx.translate(G.towerCx, oy);
    ctx.rotate(G.towerRot);
    ctx.drawImage(img, -anchorX * scale, -anchorY * scale, dw, dh);
    ctx.restore();
    return;
  }
  // v3.0.5: fixed two problems flagged in review. (1) Scale was arbitrary
  // (58px wide, whatever height fit) rather than derived from the actual
  // source footage -- the figure measures 385px tall in that footage and
  // renders at ~34 logical px in-game, so PLATFORM_SCALE below applies that
  // same ratio to the platform assets, keeping figure and platform in the
  // same visual "world scale" instead of two independently-guessed sizes.
  // (2) The trestle crop's LEFT support post was cut off mid-beam --  not
  // by my crop, by the source camera's own frame edge, which the platform
  // extends past on the left. Re-extracted a single COMPLETE post-to-post
  // bay (full post, full X-brace, full post) instead, and this now stacks
  // that complete unit vertically to reach whatever height a wave's
  // platform needs, rather than stretching one unit -- a repeated real
  // bay reads as actual scaffolding; a stretched one reads as taffy.
  if (SPR.ready && SPR.deckImg && SPR.trestleImg){
    const PLATFORM_SCALE = 34/385;
    const bayW = SPR_SCENE_DATA.trestleW*PLATFORM_SCALE, bayH = SPR_SCENE_DATA.trestleH*PLATFORM_SCALE;
    const deckW = bayW, deckH = SPR_SCENE_DATA.deckH*PLATFORM_SCALE;
    const cx = 65; // platform horizontal center, matches the old design's midpoint
    ctx.drawImage(SPR.deckImg, cx-deckW/2, oy+2-deckH*0.35, deckW, deckH);
    const legTop = oy+6, legBot = 218;
    let y = legBot;
    while (y > legTop){
      const h = Math.min(bayH, y-legTop);
      const srcH = SPR_SCENE_DATA.trestleH * (h/bayH);
      ctx.drawImage(SPR.trestleImg, 0, 0, SPR_SCENE_DATA.trestleW, srcH,
                    cx-bayW/2, y-h, bayW, h);
      y -= bayH;
    }
    return;
  }
  ctx.strokeStyle = PAL.woodDk; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(48, oy+3); ctx.lineTo(44, 218); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(88, oy+3); ctx.lineTo(92, 218); ctx.stroke();
  ctx.strokeStyle = 'rgba(74,48,24,0.6)'; ctx.lineWidth = 1;
  for (let y=oy+16; y<216; y+=22){
    const t=(y-oy)/(218-oy);
    ctx.beginPath(); ctx.moveTo(lerp(48,44,t),y); ctx.lineTo(lerp(88,92,t),y+3); ctx.stroke();
  }
  ctx.fillStyle = PAL.wood;
  ctx.fillRect(42, oy+2, 58, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(42, oy+2, 58, 1);
}

// v2: the spearfisher rebuilt with connected arms (rear arm cocks
// back during charge, lead arm points along the aim line), a walk
// cycle while moving, and posture/tunic damage states matching the
// player's CONDITION (GDD §6.1) -- the in-world damage feedback,
// separate from the v4.1 HUD hearts below (which replaced the old
// close-up face portrait; this in-scene body damage stays as-is).
function drawFigure(ox, oy, braced, moving, aimAngle, spState, chargeK, recovK, flightTicks){
  // v3.0: sprite-backed figure for the common IDLE-aiming pose (not braced,
  // not moving, not charging/thrown). COCKED/FLIGHT/RECOVERING and moving/
  // braced states keep the v2 procedural body -- those need poses this
  // footage doesn't contain (see v3 GDD Tier 1). See drawPlay() for the
  // matching suppression of the separate procedural spear draw.
  // v3.0: sprite now also covers MOVING. Static-legged, deliberately --
  // per direction, the fixed-position slide is the intended arcade feel
  // (Punch-Out!!, Duck Hunt), not a stand-in for a walk cycle that's
  // supposedly still owed. No walk animation is being sought for the
  // player figure; this is the finished look, not a placeholder.
  // and FLIGHT (the figure holds its follow-through while the actual thrown
  // spear is drawn separately, mid-air, by drawSpear() -- see drawPlay()).
  // v3.0: sprite now covers every non-braced state, including RECOVERING.
  // RECOVERING briefly shows a spear baked into the sprite's hand even
  // though narratively it's just been thrown -- the real spear may still
  // be visible mid-flight or stuck in whatever it hit, drawn separately.
  // Flagged and explicitly overruled: procedural fallback for a single
  // brief state wasn't worth it, so this stays sprite-only until a real
  // empty-handed follow-through exists to swap in.
  const spriteEligible = !braced;
  // v3.0.6: removed the dedicated COCKED sprite entirely, per direction --
  // it broke twice. First pass showed the spear already extended (wrong
  // pose semantics). Second pass, after re-extracting: the source frame's
  // figure-extraction mask picked up a chunk of the actual wooden deck
  // baked into the sprite alongside him, since both are warm-toned pixels
  // to the same color heuristic that separated him from the cool-toned
  // water. That contaminated crop caused two visible bugs at once -- a
  // "double pier" (the game's real platform plus this baked-in fragment)
  // and a position jump (the contaminated bounding box threw off the
  // computed foot anchor). Rather than attempt a third extraction, COCKED
  // now falls through to the same aim-bucket sprite every other state
  // (IDLE/MOVING/FLIGHT/RECOVERING) already uses without issue.
  // Real player-figure reference art: six purpose-made angle-bucket poses
  // (superseding an earlier single-pose-plus-rotation approximation, which
  // read as the character collapsing forward rather than aiming). Snaps to
  // the nearest bucket for the current aim angle, same idea as the old
  // SPR.figImg aim-bucket sprite below, just with dedicated art per angle
  // instead of one photographed pose. Checked first; falls through to the
  // old bucket sprite, then the vector body, if these never load.
  // v7.3: real wind-up/release/recovery animation, checked before the
  // static idle buckets below -- see PLAYER_THROW_ANIM above for why this
  // only covers COCKED/FLIGHT/RECOVERING (IDLE/MOVING keep the buckets
  // untouched) and why one clip's baked angle is close enough to this
  // system's shallowest bucket to reuse its same +-20deg correction.
  // v7.3.1: FLIGHT only shows the lunge/follow-through for a short beat
  // (FLIGHT_POSE_TICKS) rather than for the state's whole duration. FLIGHT
  // lasts as long as the real spear's physics flight does (often well over
  // a second), and holding one dramatic frozen pose that entire time read
  // as the figure getting stuck -- worse than the old always-the-idle-pose
  // behavior it replaced, since a frozen lunge draws the eye in a way a
  // frozen neutral stance doesn't. Past that beat this falls through to
  // the same idle-bucket sprite used before this feature existed, the same
  // graceful degradation every other path below already relies on.
  const FLIGHT_POSE_TICKS = 10;
  const showFlightPose = spState==='FLIGHT' && (flightTicks||0) < FLIGHT_POSE_TICKS;
  if (spriteEligible && PLAYER_THROW_ANIM.ready &&
      (spState==='COCKED' || showFlightPose || spState==='RECOVERING')){
    let frames, idx;
    if (spState==='COCKED'){
      frames = PLAYER_THROW_ANIM.wind;
      idx = Math.min(frames.length-1, Math.floor(clamp(chargeK,0,1)*frames.length));
    } else if (spState==='FLIGHT'){
      frames = PLAYER_THROW_ANIM.release; idx = 0;
    } else {
      frames = PLAYER_THROW_ANIM.recov;
      idx = Math.min(frames.length-1, Math.floor(clamp(recovK||0,0,1)*frames.length));
    }
    const img = frames[idx];
    if (img){
      // v7.3: body-height-matched scale, not the idle buckets' 34/390 --
      // this crop's own source dimensions differ (the union rectangle spans
      // the spear's full reach during both the overhead wind-up and the
      // re-gripped recovery, wider than any single idle pose needs), so
      // that constant would render him noticeably smaller. 0.196 instead
      // targets the same ~36px foot-to-head body height the idle buckets
      // read at, measured directly off this crop's own anchor point.
      const scale = 0.196;
      const dw = img.width*scale, dh = img.height*scale;
      const spec = PLAYER_THROW_SPEC;
      const target = aimAngle !== undefined ? aimAngle : 48;
      const correction = clamp(target - spec.renderAngle, -20, 20) * D2R;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(correction);
      ctx.drawImage(img, -spec.anchorX*scale, -spec.anchorY*scale, dw, dh);
      ctx.restore();
      return;
    }
  }
  const figBucket = nearestPlayerFigBucket(aimAngle !== undefined ? aimAngle : 48);
  if (figBucket && spriteEligible){
    const scale = 34 / 390; // matches the old sprite's ~34px-tall convention
    const dw = figBucket.img.width * scale, dh = figBucket.img.height * scale;
    // Small corrective rotation closing the gap between this bucket's own
    // baked-in throw angle and the true current aim angle (see
    // PLAYER_FIG_SPECS comment) -- capped at +-20deg, the range already
    // confirmed clean (vs. a full uncapped delta, confirmed broken-looking)
    // when this same rotate-around-the-planted-foot technique was tried
    // for the single-pose predecessor of this bucket system.
    const target = aimAngle !== undefined ? aimAngle : 48;
    const correction = clamp(target - figBucket.renderAngle, -20, 20) * D2R;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(correction);
    ctx.drawImage(figBucket.img, -figBucket.anchorX * scale, -figBucket.anchorY * scale, dw, dh);
    ctx.restore();
    return;
  }
  if (SPR.ready && SPR.figImg && spriteEligible){
    const b = nearestFigBucket(aimAngle);
    const scale = 0.46; // old vector figure was ~19px tall; this gives ~34px -- a deliberate but modest bump
    const dw = b.w*scale, dh = b.h*scale;
    const feetX = SPR_DATA.figAtlas.feetCentre.x*scale, feetY = SPR_DATA.figAtlas.feetCentre.y*scale;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.drawImage(SPR.figImg, b.x, b.y, b.w, b.h, -feetX, -feetY, dw, dh);
    ctx.restore();
    return;
  }
  const cond = G.condition;
  const stoop = cond<=1 ? 1.6 : (cond===2 ? 0.8 : 0);
  const walkPhase = moving ? (Math.floor(G.t/5)%2) : 0;
  ctx.save();
  ctx.translate(ox, oy);
  // legs
  ctx.fillStyle = PAL.ink;
  if (braced){
    ctx.fillRect(-5,-2,4,4); ctx.fillRect(2,-2,4,4);
  } else if (moving){
    const off = walkPhase===0 ? 1 : -1;
    ctx.fillRect(-2-off,-2,2,4); ctx.fillRect(1+off,-2,2,4);
  } else {
    ctx.fillRect(-2,-2,2,3); ctx.fillRect(1,-2,2,3);
  }
  // torso (tunic darkens/tears once hurt)
  ctx.fillStyle = cond<=2 ? '#5a4326' : PAL.ink;
  ctx.fillRect(-2,-12+stoop,5,10);
  ctx.fillStyle = PAL.wood; ctx.fillRect(-2,-4+stoop,5,1.4); // belt
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(0,-11+stoop); ctx.lineTo(0,-3+stoop); ctx.stroke(); // seam
  if (cond<=2){
    ctx.strokeStyle=PAL.ink; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(2,-11+stoop); ctx.lineTo(3.5,-8.5+stoop); ctx.stroke(); // torn shoulder
  }
  // head
  ctx.fillStyle = '#8a5a34';
  ctx.fillRect(-3,-17+stoop,7,5);
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(-3.5,-18+stoop,8,1.4); // hair tie
  // arms — the lead arm points along the aim line, the rear arm
  // cocks back visibly while charging
  const a = (aimAngle!==undefined ? aimAngle : 48)*D2R;
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth=1.6;
  const leadEx = 2+Math.cos(a)*6, leadEy = -8+Math.sin(a)*6+stoop;
  ctx.beginPath(); ctx.moveTo(2,-9+stoop); ctx.lineTo(leadEx,leadEy); ctx.stroke();
  const back = spState==='COCKED' ? clamp(chargeK,0,1) : 0;
  ctx.beginPath(); ctx.moveTo(-2,-9+stoop); ctx.lineTo(-4-back*5, -11-back*3+stoop); ctx.stroke();
  ctx.restore();
}

// spear: deliberately the most detailed sprite in the scene, drawn
// oversized relative to the figure — ported directly from drawSpear().
// The spear is drawn from the sprite (assets/sprites/spear.png); the procedural
// version below is only the fallback if that image fails to load. The spear buffs
// were removed.
// Upgraded aim reticle -- a ring + four outward ticks, drawn twice (a dark
// halo pass then the bright gold pass, same two-pass idiom as haloText())
// so it reads against sky, water, and rock alike. Replaces a plain 6px
// gold X with no halo, which disappeared against anything gold/light.
function drawReticle(x, y){
  const r = 4.5;
  function pass(color, width){
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - r - 4, y); ctx.lineTo(x - r + 1, y);
    ctx.moveTo(x + r - 1, y); ctx.lineTo(x + r + 4, y);
    ctx.moveTo(x, y - r - 4); ctx.lineTo(x, y - r + 1);
    ctx.moveTo(x, y + r - 1); ctx.lineTo(x, y + r + 4);
    ctx.stroke();
  }
  pass('rgba(20,14,8,0.8)', 3);
  pass(PAL.gold, 1.4);
  ctx.fillStyle = PAL.gold;
  ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
}

function drawSpear(x1, y1, x2, y2, headSize){
  if (SPR.ready && SPR.spearImg){
    drawSpearSprite(x1, y1, x2, y2);
    return;
  }
  drawSpearProcedural(x1, y1, x2, y2, headSize);
}
function drawSpearSprite(x1, y1, x2, y2){
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  if (len<1) return;
  const atlas = SPR_SPEAR_DATA.spearAtlas;
  const natLen = atlas.frameW - atlas.grip.x; // grip-to-tip span in the packed image
  const scale = len / natLen;
  ctx.save();
  ctx.translate(x1, y1);
  ctx.rotate(Math.atan2(dy, dx));
  ctx.drawImage(SPR.spearImg, 0, 0, atlas.frameW, atlas.frameH,
                -atlas.grip.x*scale, -atlas.grip.y*scale, atlas.frameW*scale, atlas.frameH*scale);
  ctx.restore();
}
function drawSpearProcedural(x1, y1, x2, y2, headSize){
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  if (len<1) return;
  const ux=dx/len, uy=dy/len, px=-uy, py=ux;
  headSize = headSize || 5;

  ctx.strokeStyle = '#5a4326'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-ux*headSize*0.8, y2-uy*headSize*0.8); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(x1+px*0.6,y1+py*0.6); ctx.lineTo(x2-ux*headSize*0.8+px*0.6, y2-uy*headSize*0.8+py*0.6); ctx.stroke();

  ctx.strokeStyle = '#2b1d10'; ctx.lineWidth = 1.2;
  const wraps = Math.max(1, Math.min(3, Math.floor(len/9)));
  for (let i=1;i<=wraps;i++){
    const t = (i/(wraps+1)) * Math.min(len*0.55, 14);
    const wx=x1+ux*t, wy=y1+uy*t;
    ctx.beginPath(); ctx.moveTo(wx-px*2.2, wy-py*2.2); ctx.lineTo(wx+px*2.2, wy+py*2.2); ctx.stroke();
  }

  {
    ctx.fillStyle = '#d8d2c4';
    ctx.strokeStyle = PAL.ink; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2-ux*headSize+px*headSize*0.45, y2-uy*headSize+py*headSize*0.45);
    ctx.lineTo(x2-ux*headSize*0.55, y2-uy*headSize*0.55);
    ctx.lineTo(x2-ux*headSize-px*headSize*0.45, y2-uy*headSize-py*headSize*0.45);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2-ux*headSize*0.35+px*headSize*0.4, y2-uy*headSize*0.35+py*headSize*0.4);
    ctx.lineTo(x2-ux*headSize*1.15+px*headSize*0.75, y2-uy*headSize*1.15+py*headSize*0.75);
    ctx.moveTo(x2-ux*headSize*0.35-px*headSize*0.4, y2-uy*headSize*0.35-py*headSize*0.4);
    ctx.lineTo(x2-ux*headSize*1.15-px*headSize*0.75, y2-uy*headSize*1.15-py*headSize*0.75);
    ctx.stroke();
  }
}

// fish silhouettes — one hand-built shape per species, ported point-
// for-point from drawFishShape()'s offset rects/lines. v2 adds a
// species-distinguishing body colour and one high-contrast flank mark
// per species (GDD §6.2), plus depth-based contrast via alpha blend.
function orect(cx,cy,ox,oy,w,h,dir){ ctx.fillRect(cx+dir*ox-w/2, cy+oy-h/2, w, h); }
function oline(cx,cy,ox1,oy1,ox2,oy2,dir){ ctx.beginPath(); ctx.moveTo(cx+dir*ox1,cy+oy1); ctx.lineTo(cx+dir*ox2,cy+oy2); ctx.stroke(); }
function ohole(cx,cy,ox,oy,dir){ ctx.fillStyle='#fdf8ec'; ctx.fillRect(cx+dir*ox-0.6, cy+oy-0.6, 1.2, 1.2); }

const FISH_COLOR = {
  redband:   { body:'#8a5a34', accent:'#c85a34' }, // broad red-orange lateral stripe
  bull:      { body:'#3f4a3c', accent:'#e8d9b0' }, // pale cream spots on a dark body
  chinook:   { body:'#5a4326', accent:'#241a10' }, // hooked kype, dark heavy dorsal
  steelhead: { body:'#a8bcc4', accent:'#d99aa8' }, // chrome flank, faint pink wash
};
// v3.0: sprite-backed fish render. Keeps the exact call signature and logical
// footprint of the old vector drawFishShape (species width ~= SPECIES[key].len
// logical px) so every call site in the game is untouched. Ping-pong playback
// per the atlas (source drifts rather than looping cleanly -- see v3 GDD).
const FISH_ANIM = {};
// v3.0.1: anchor fix. This was wrongly commented as matching the old
// vector shape's anchor -- it doesn't. The old shapes (e.g. `orect(x,y,
// 0,0, 9,3, dir)`) were drawn CENTERED on (x,y), and the catch-radius math
// (`9+len*0.45`, in updateSpearFlight) was tuned against that center point.
// Anchoring on noseTip instead shifts the visual body back from the actual
// collision point by roughly half the fish's length -- worst on the
// longest species (chinook, len 21) -- so a spear that visually skewers
// the tail can miss the hit-check entirely. Anchoring on the frame's own
// center (each frame was already built symmetrically padded around the
// fish, so this closely matches its visual center) instead.
// v5: added `animate` (default false) -- only the live in-river fish
// (drawPlay's G.fish loop) should actually swim/flap; the trophy row,
// tally/species portrait, and the "taken" fish flying to the tally
// counter should all render a single still frame. See drawFishShape's
// call sites for exactly where `animate:true` is (and isn't) passed.
function drawFishSprite(x, y, key, dir, sc, alpha, animate){
  const sp = SPR_DATA.fishAtlas.sprites[key];
  const order = SPR_DATA.fishAtlas.playback.loopOrder;
  if (!FISH_ANIM[key]) FISH_ANIM[key] = 0;
  // advance once every 4 ticks (~7.5fps of the extracted 30fps source, matches
  // the source's own slow drift) -- driven by G.t so it's deterministic.
  // When not animating, skip the frame-index math entirely and just use
  // the species' first loop frame as a fixed resting pose.
  const oi = animate ? Math.floor(G.t/4) % order.length : 0;
  const fr = sp.frames[order[oi]];
  // target width equals the old vector fish's footprint (len*2, roughly its
  // total nose-to-tail span) * sc, so hitboxes/spacing/collision are unaffected
  const targetW = (SPECIES[key] ? SPECIES[key].len*2.1 : 18) * sc;
  const scale = targetW / fr.w;
  const dw = fr.w*scale, dh = fr.h*scale;
  ctx.save();
  if (alpha!==undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  // sprite sheet is normalised to face RIGHT; dir<0 means facing left
  if (dir < 0) ctx.scale(-1,1);
  ctx.drawImage(SPR.fishImg, fr.x, fr.y, fr.w, fr.h, -dw/2, -dh/2, dw, dh);
  ctx.restore();
}
function drawFishShape(x, y, key, dir, sc, alpha, animate){
  sc = sc || 1;
  if (SPR.ready && SPR.fishImg && SPR_DATA.fishAtlas.sprites[key]){
    drawFishSprite(x, y, key, dir, sc, alpha, animate);
    return;
  }
  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc); x=0; y=0;
  if (alpha!==undefined) ctx.globalAlpha = alpha;
  const col = FISH_COLOR[key] || {body:'#6b4a2a', accent:'#2b1d10'};
  ctx.fillStyle = col.body;
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 0.9/sc;

  if (key==='redband'){
    orect(x,y, 0,0, 9,3, dir); orect(x,y, 3,-1.5, 3,2, dir);
    oline(x,y, 4.5,-0.5, 6,0.5, dir);
    oline(x,y, -4.5,0, -7,-2.5, dir); oline(x,y, -4.5,0, -7,2.5, dir);
    ctx.strokeStyle = col.accent; ctx.lineWidth = 1.1/sc;
    oline(x,y, -3.5,0.3, 4,0.3, dir);
    ctx.strokeStyle = PAL.ink;
    ohole(x,y, 4,-1, dir);
  } else if (key==='bull'){
    orect(x,y, 0,0, 12,5, dir); orect(x,y, 5,-1, 3,3, dir);
    oline(x,y, -6,-2, -8,-2.5, dir); oline(x,y, -6,2, -8,2.5, dir);
    oline(x,y, -8,-2.5, -8,2.5, dir);
    ctx.fillStyle = col.accent;
    orect(x,y, -1,-1.4, 1,1, dir); orect(x,y, 2,0.5, 1,1, dir); orect(x,y, -4,1.5, 1,1, dir);
    ohole(x,y, 5.5,-1.5, dir);
  } else if (key==='chinook'){
    orect(x,y, 0,0, 18,5, dir); orect(x,y, 7,-1, 4,3, dir);
    oline(x,y, 10,0.5, 13,2, dir); oline(x,y, 13,2, 10,2.5, dir);
    oline(x,y, -8,-2.5, -12,-4, dir); oline(x,y, -8,2.5, -12,4, dir);
    ctx.strokeStyle = col.accent; ctx.lineWidth=1/sc;
    oline(x,y, 8,-1.5, 10.5,-2.5, dir);
    ctx.strokeStyle = PAL.ink;
    ohole(x,y, 7.5,-1.5, dir);
  } else if (key==='steelhead'){
    orect(x,y, 0,0, 14,3, dir); orect(x,y, 5.5,-1, 3,2, dir);
    oline(x,y, 3,-1.5, 4.5,-3, dir);
    oline(x,y, -6.5,0, -9.5,-3, dir); oline(x,y, -6.5,0, -9.5,3, dir);
    ctx.strokeStyle = col.accent; ctx.lineWidth=1.4/sc;
    oline(x,y, -3,-0.6, 3,-0.6, dir);
    ctx.strokeStyle = PAL.ink;
    ohole(x,y, 6,-1, dir);
  } else {
    orect(x,y, 0,0, 9,3, dir);
  }
  ctx.restore();
}

// v3.0: sprite-backed miner body (WHITE_GUY.MP4 pier-walk footage -- a real
// walk cycle for enemies, distinct on purpose from the player figure, which
// slides in a fixed position by design, not by missing asset. See drawFigure().
