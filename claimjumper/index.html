// Faces LEFT in-game (miners walk in from off-screen right, toward the
// pier on the left); source footage faces right, so this mirrors it. No windup/throw
// motion exists in the source, so the small procedural arm+rock/rod gesture
// stays layered on top of the sprite body for 'wind' and 'jumper' -- same
// reasoning as the player figure's COCKED-arm cut, just not literally
// removable here since the miner's throw needs a directional tell.
function drawMinerSprite(m){
  const atlas = SPR_MINER_DATA.minerAtlas;
  let frameIdx;
  if (m.state==='walk'){
    const cyc = atlas.animations.walk.frames;
    frameIdx = cyc[Math.floor(G.t/5) % cyc.length];
  } else if (m.state==='wind'){
    frameIdx = atlas.animations.bend.frames[0];
  } else {
    frameIdx = atlas.animations.stand.frames[0];
  }
  const fr = atlas.frames[frameIdx];
  const scale = 0.33; // matches the player figure's own vector->sprite bump
  const dw = fr.w*scale, dh = fr.h*scale;
  const feetX = atlas.feetCentre.x*scale, feetY = atlas.feetCentre.y*scale;
  ctx.save();
  ctx.translate(m.x, WATER_Y);
  ctx.scale(-1,1); // source faces right; miners face left toward the player
  ctx.drawImage(SPR.minerImg, fr.x, fr.y, fr.w, fr.h, -feetX, -feetY, dw, dh);
  ctx.restore();
}
// v7 §1.1/§1.3/§1.4: flat reskin once a skin asset is loaded. These are
// single static throwing-pose illustrations, not a walk-cycle sheet like
// the base miner sprite, so unlike drawMinerSprite this draws the same
// pose in every state -- a deliberate simplification, not an attempt to
// replicate the walk animation.
function drawMinerSkin(m){
  // v7.3: animated skins take priority when loaded -- see MINER_ANIM above
  // for why the anchor point works the same way across every frame.
  const anim = MINER_ANIM[m.skin];
  if (anim && anim.ready){
    // v7.3: walk frames use a different convention than stand/wind/release
    // -- each is individually tight-cropped (the character physically
    // traverses screen distance while walking, so a shared rectangle would
    // misalign the feet the way it does for a stationary throw), so this
    // renders them with simple center-x/bottom-y anchoring instead of the
    // shared anchorX/anchorY below. Cycles by game tick, not m.x distance
    // travelled -- simpler, and the walk speed is already near-constant.
    if (m.state === 'walk' && anim.walk.length){
      const img = anim.walk[Math.floor(G.t/4) % anim.walk.length];
      if (img){
        const targetH = m.skin==='soldier' ? 56 : 50;
        const scale = targetH / img.height;
        const dw = img.width*scale, dh = img.height*scale;
        ctx.drawImage(img, m.x-dw/2, WATER_Y-dh, dw, dh);
        return;
      }
    }
    let frames, idx;
    if (m.state === 'wind' && anim.wind.length){
      frames = anim.wind; idx = Math.min(frames.length - 1, Math.floor((m.arm || 0) * frames.length));
    } else if (m.state === 'release' && anim.release.length){
      frames = anim.release; idx = Math.min(frames.length - 1, m.releaseFrame || 0);
    } else {
      frames = anim.stand; idx = 0;
    }
    const img = frames[idx];
    if (img){
      const targetH = m.skin==='soldier' ? 56 : 50;
      const scale = targetH / img.height;
      const dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, m.x - anim.anchorX*scale, WATER_Y - anim.anchorY*scale, dw, dh);
      return;
    }
  }
  const img = SKINS[m.skin];
  const targetH = m.skin==='soldier' ? 56 : 50; // matches drawVinegarMiner's existing "taller" bump
  const scale = targetH / img.height;
  const dw = img.width*scale, dh = img.height*scale;
  ctx.drawImage(img, m.x-dw/2, WATER_Y-dh, dw, dh);
}
function drawMiner(m){
  if (m.state==='gone') return;
  if (m.skin && SKINS[m.skin]){ drawMinerSkin(m); return; }
  if (SPR.ready && SPR.minerImg){
    drawMinerSprite(m);
    const x = m.x, y = WATER_Y;
    // v3.0: pivot recomputed from the ACTUAL hand position in the source
    // sprite (measured directly off the pixels, then run through the same
    // mirror transform drawMinerSprite uses) rather than reusing the old
    // vector body's offsets. Those pointed rightward-and-slightly-up because
    // that's where the OLD body's arm was -- but this sprite is mirrored
    // (source faces right, miners face left), so the real hand sits well to
    // the LEFT of m.x, not the right. That direction error, not just a
    // scale mismatch, is why earlier attempts left the rock floating
    // nowhere near his hand.
    // Also only drawn for stand/wind: the pivot is measured off the
    // stand/bend pose specifically and doesn't track the walk-cycle frames,
    // so a walking miner would show a rock floating off his hip if this
    // fired during 'walk' too (caught the same way -- checked, not assumed).
    if (m.state==='stand' || m.state==='wind'){
      const px = x-22, py = y-14;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.3;
      if (m.type==='rock'){
        if (m.state==='wind'){
          const a = -1.2 - m.arm*1.1;
          const ex = px+Math.cos(a)*7, ey = py+Math.sin(a)*7;
          ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
          ctx.fillStyle = '#5a5f66'; ctx.fillRect(ex-1.5,ey-1.5,3,3);
        } else {
          ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-5,py+3); ctx.stroke();
        }
      } else if (m.stolen && m.stolen.length){
        // The rival angler already carries three salmon on his cord in the
        // sprite; every fish he steals hangs from the same hand next to them.
        const hx = x-15, hy = WATER_Y-30;
        m.stolen.forEach((key, i) => {
          const sway = Math.sin(G.t*0.12 + i*1.7) * 0.12;
          ctx.save();
          ctx.translate(hx - 6 - i*3.4, hy + (i%2)*2);
          ctx.rotate(sway);
          ctx.strokeStyle = PAL.ink; ctx.lineWidth = 0.6;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,6); ctx.stroke();
          ctx.translate(0, 6 + 7);
          ctx.rotate(-Math.PI/2);
          drawFishShape(0, 0, key, 1, 0.6);
          ctx.restore();
        });
      }
    }
    return;
  }
  const x = m.x, y = WATER_Y;
  ctx.fillStyle = '#3a2c1c';
  ctx.fillRect(x-2, y-14, 5, 10);
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(x-2, y-4, 2, 4); ctx.fillRect(x+1, y-4, 2, 4);
  ctx.fillStyle = '#8a6338';
  ctx.fillRect(x-3, y-19, 7, 5);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.3;
  if (m.type==='rock'){
    if (m.state==='wind'){
      const a = -1.2 - m.arm*1.1;
      const ex = x+2+Math.cos(a)*7, ey = y-12+Math.sin(a)*7;
      ctx.beginPath(); ctx.moveTo(x+2,y-12); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.fillStyle = '#5a5f66'; ctx.fillRect(ex-1.5,ey-1.5,3,3);
    } else {
      ctx.beginPath(); ctx.moveTo(x+2,y-12); ctx.lineTo(x+7,y-9); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.moveTo(x-3,y-12); ctx.lineTo(x-16,y+10); ctx.stroke();
    ctx.fillStyle = '#7a8a6a'; ctx.fillRect(x-17.5,y+8.5,3,3);
  }
}
// v2: the vinegar miner — taller, dark coat, wide-brim hat, and a
// gold glint cycling on the bottle throughout the approach (GDD §6.3)
// v3.0: runtime recolor cache for the vinegar miner. Same extracted body as
// the regular miner (no second source clip for him), tinted dark via a
// source-atop pass on an offscreen canvas so the shading/detail underneath
// still reads instead of flattening to a silhouette. Per direction, this
// replaces drawVinegarMiner's old fully-procedural body outright rather
// than keeping it as a "windup" special case -- the bottle+arm gesture is
// the only procedural part now, same pattern as the rock miner's rock.
const VINEGAR_TINT_CACHE = {};
function getVinegarTintedFrame(frameIdx){
  if (VINEGAR_TINT_CACHE[frameIdx]) return VINEGAR_TINT_CACHE[frameIdx];
  const fr = SPR_MINER_DATA.minerAtlas.frames[frameIdx];
  const oc = document.createElement('canvas');
  oc.width = fr.w; oc.height = fr.h;
  const octx = oc.getContext('2d');
  octx.drawImage(SPR.minerImg, fr.x, fr.y, fr.w, fr.h, 0, 0, fr.w, fr.h);
  octx.globalCompositeOperation = 'source-atop';
  octx.fillStyle = 'rgba(12,10,9,0.78)'; // dark coat tint (GDD §6.3) -- darkened further, first pass read too close to the regular miner's colors
  octx.fillRect(0, 0, fr.w, fr.h);
  VINEGAR_TINT_CACHE[frameIdx] = oc;
  return oc;
}
function drawVinegarMiner(m){
  if (m.state==='gone') return;
  if (m.skin && SKINS[m.skin]){ drawMinerSkin(m); return; }
  if (SPR.ready && SPR.minerImg){
    const atlas = SPR_MINER_DATA.minerAtlas;
    let frameIdx;
    if (m.state==='walk'){
      const cyc = atlas.animations.walk.frames;
      frameIdx = cyc[Math.floor(G.t/6) % cyc.length]; // slightly slower cadence -- he approaches slower too
    } else if (m.state==='wind'){
      frameIdx = atlas.animations.bend.frames[0];
    } else {
      frameIdx = atlas.animations.stand.frames[0];
    }
    const fr = atlas.frames[frameIdx];
    const scale = 0.33*1.12; // "taller" (GDD §6.3) -- a modest bump over the regular miner
    const dw = fr.w*scale, dh = fr.h*scale;
    const feetX = atlas.feetCentre.x*scale, feetY = atlas.feetCentre.y*scale;
    const tinted = getVinegarTintedFrame(frameIdx);
    ctx.save();
    ctx.translate(m.x, WATER_Y);
    ctx.scale(-1,1);
    ctx.drawImage(tinted, 0, 0, fr.w, fr.h, -feetX, -feetY, dw, dh);
    ctx.restore();

    // same corrected hand pivot as drawMiner, adjusted for the slightly
    // larger scale -- a hand-drawn vinegar bottle (not a video asset: no
    // source footage shows a throw, so this is genuinely drawn, per request).
    // Only drawn for stand/wind, same reasoning and same bug already caught
    // and fixed in drawMiner: the pivot doesn't track the walk-cycle frames.
    if (m.state==='stand' || m.state==='wind'){
      const px = m.x-24.5, py = WATER_Y-15.7;
      const glintOn = Math.floor(G.t/8)%2===0;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.3;
      let bx, by;
      if (m.state==='wind'){
        const a = -1.2 - m.arm*1.1;
        bx = px+Math.cos(a)*7; by = py+Math.sin(a)*7;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(bx,by); ctx.stroke();
      } else {
        bx = px-5; by = py+3;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(bx,by); ctx.stroke();
      }
      // the bottle: a rounded body, a narrow neck, a cork line -- deliberately
      // drawn (not extracted), same idiom as drawSpear's hand-built detail
      ctx.fillStyle = PAL.glassGrn;
      ctx.fillRect(bx-1.6, by-1.2, 3.2, 3.6);
      ctx.fillRect(bx-0.7, by-2.6, 1.4, 1.6);
      ctx.fillStyle = '#5a4326';
      ctx.fillRect(bx-0.7, by-3.2, 1.4, 0.8);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(bx-0.8,by-0.6); ctx.lineTo(bx-0.8,by+1.8); ctx.stroke();
      if (glintOn){ ctx.fillStyle='#e8d24a'; ctx.fillRect(bx+0.4,by-1.8,0.9,0.9); }
    }
    return;
  }
  const x = m.x, y = WATER_Y;
  ctx.fillStyle = '#241a18';
  ctx.fillRect(x-3, y-18, 6, 14);
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(x-2, y-4, 2, 4); ctx.fillRect(x+1, y-4, 2, 4);
  ctx.fillStyle = '#8a6338';
  ctx.fillRect(x-3, y-23, 7, 4);
  ctx.fillStyle = '#1a120c';
  ctx.fillRect(x-6, y-24, 13, 2);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.3;
  const glintOn = Math.floor(G.t/8)%2===0;
  if (m.state==='wind'){
    const a = -1.2 - m.arm*1.1;
    const ex = x+2+Math.cos(a)*7, ey = y-14+Math.sin(a)*7;
    ctx.beginPath(); ctx.moveTo(x+2,y-14); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle = PAL.glassGrn; ctx.fillRect(ex-1.5,ey-2.5,3,4);
    if (glintOn){ ctx.fillStyle='#e8d24a'; ctx.fillRect(ex-0.5,ey-2,1,1); }
  } else {
    ctx.beginPath(); ctx.moveTo(x+2,y-14); ctx.lineTo(x+6,y-10); ctx.stroke();
    ctx.fillStyle = PAL.glassGrn; ctx.fillRect(x+4.5,y-11.5,3,4);
    if (glintOn){ ctx.fillStyle='#e8d24a'; ctx.fillRect(x+5.5,y-11,1,1); }
  }
}

// --- v4.1 HUD redesign: hearts replace the CONDITION pips + portrait,
// a session-wide species/kills trophy row replaces the per-wave fish
// count + on-screen fish count, and the top-center wave-progress
// squares are gone (the wave-intro cards already announce each wave).
// LIVES (triangles) and BALANCE (the meter below) are unchanged, just
// shifted up into the room the portrait used to occupy.
function heartPath(cx, cy, s){
  ctx.beginPath();
  ctx.moveTo(cx, cy+s*0.9);
  ctx.bezierCurveTo(cx-s*1.3, cy-s*0.3, cx-s*0.6, cy-s*1.3, cx, cy-s*0.4);
  ctx.bezierCurveTo(cx+s*0.6, cy-s*1.3, cx+s*1.3, cy-s*0.3, cx, cy+s*0.9);
  ctx.closePath();
}
function drawHearts(x0,y0){
  const n = 4, s = 4.2, gap = 10;
  // v4.3: filled hearts are red now (PAL.bloodDk, already in the
  // palette -- no new color introduced), with a thin ink edge stroke
  // so the red stays crisp against any of the painted backgrounds,
  // same reasoning as the text halo pass. The old low-health cue only
  // pulsed the OUTLINE of the empty hearts, which was too subtle to
  // notice -- replaced with a flash on the remaining FULL hearts
  // themselves (red <-> gold) when down to the last heart, a much
  // bigger, harder-to-miss signal, matching the classic "critical
  // health" convention. Flinch-shake on hit is unchanged.
  const shake = G.portraitFlinch>0 ? (G.portraitFlinch%4<2 ? -1 : 1) : 0;
  const critical = G.condition<=1;
  const flashOn = critical && Math.sin(G.t*0.35)>0;
  for (let i=0;i<n;i++){
    const cx = x0+i*gap+s+shake, cy = y0+s;
    heartPath(cx, cy, s);
    if (i < G.condition){
      ctx.fillStyle = (critical && flashOn) ? PAL.gold : PAL.bloodDk;
      ctx.fill();
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 0.8;
      ctx.stroke();
    } else {
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
  }
}
// v4.3: the triangle row for LIVES carried no inherent meaning (unlike
// the fish silhouettes or hearts, a plain triangle doesn't read as
// "extra lives" on its own) -- replaced with an explicit text label,
// same "icon + \u00d7N" language already used in the trophy row, just
// text-only here since there's no simple recognizable "extra life"
// glyph to pair it with.
function ltext(s, x, y, opt){ haloText(s, x, y, 'left', opt); }
function drawStreakHUD(){
  if (G.streak>=2){
    ctext('CLEAN \u00d7 '+G.streak, 216, {font:'11px Georgia', color:'#4a3018'});
  }
}
function drawBanner(){
  // Pop-up text banners are switched off for now (less text in the game).
  // G.banner is still set by the game logic; it just isn't drawn.
  if (false && G.banner){
    ctx.save();
    ctx.globalAlpha = clamp(G.banner.t/15,0,1);
    boldCText(G.banner.text, 40, 15);
    ctx.restore();
  }
}
function drawDrops(){
  for (const d of G.drops){
    const k = d.t/d.dur;
    const x = lerp(d.x, d.tx, k);
    const y = lerp(d.y, d.ty, k) - Math.sin(k*Math.PI)*14;
    ctx.fillStyle = PAL.gold;
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
  }
}
function iconSpearTick(x,y){
  ctx.strokeStyle = PAL.ink; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x,y+6); ctx.lineTo(x+7,y-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+7,y-1); ctx.lineTo(x+4,y-1); ctx.moveTo(x+7,y-1); ctx.lineTo(x+7,y+2); ctx.stroke();
}
// v4.1: small pickaxe glyph for the miners-speared row -- distinct from
// the fish silhouettes above it at a glance, on-theme for a mining-camp
// antagonist, drawn with the same flat line-art language as iconSpearTick.
// v4.3: the old iconPick (a bare two-line "handle + V-head" doodle,
// unfilled) didn't read as a pickaxe at any size -- replaced with the
// same 8-ray impact starburst the game already draws in-world at the
// moment a miner is actually speared (see G.minerHit below), just
// static instead of animated/growing. Same color, same ray pattern,
// so this icon is visually the same "you hit him" cue the player has
// already seen fire live, not a new symbol they have to learn cold.
function iconMinerHit(x,y,sc){
  sc = sc || 1;
  const r = 5*sc, inner = r*0.4;
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 1.4*sc;
  for (let a=0;a<8;a++){
    const ang = a*(Math.PI/4);
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(ang)*inner, y+Math.sin(ang)*inner);
    ctx.lineTo(x+Math.cos(ang)*r, y+Math.sin(ang)*r);
    ctx.stroke();
  }
}
// v4.1: session-wide trophy row, replacing the old per-wave "fish
// caught this wave" counter and the "fish currently on screen"
// counter (the latter was pure noise -- removed outright, no
// replacement). G.total already accumulates every catch across the
// whole run (not reset between waves, unlike G.cache), and
// G.minersSpeared already counts every miner killed all game -- both
// existed already but were never actually shown anywhere. All four
// species are always drawn, dimmed when the session count is still
// zero, so the row doubles as a quiet "there are four species" cue.
// v5: miners row removed from the persistent HUD entirely -- no
// replacement icon here, it just leaves this corner. The session-wide
// total is still tracked (G.minersSpeared, untouched) and now surfaces
// only on the wave-summary tally page (see drawTally's 'miners' branch)
// and the existing end-credits screen.
// Fish HUD, no text: one small pile per species to the right of the hearts.
// A caught fish floats up from where it was speared, lands on top of its pile
// and the pile grows downward. Piles compress once they get tall.
const FISH_HUD_X0 = 54, FISH_HUD_Y0 = 8, FISH_HUD_SC = 0.6;
function fishHudWidth(key){ return SPECIES[key].len*2.1*FISH_HUD_SC + 5; }
function fishHudStep(n){ return n<=16 ? 3.4 : 54/n; }
function fishHudColX(key){
  let x = FISH_HUD_X0;
  for (const k of SPECIES_ORDER){
    if (k===key) return x + fishHudWidth(k)/2;
    x += fishHudWidth(k);
  }
  return x;
}
function drawFishHud(){
  const fly = G.flyFish || [];
  let any = false;
  for (const k of SPECIES_ORDER) if ((G.total[k]||0) > 0) any = true;
  if (any){
    let w = 0, tall = 0;
    for (const k of SPECIES_ORDER){ w += fishHudWidth(k); const n = G.total[k]||0; tall = Math.max(tall, (n-1)*fishHudStep(n)); }
    ctx.fillStyle = 'rgba(14,20,36,0.22)';
    ctx.fillRect(FISH_HUD_X0-3, FISH_HUD_Y0-5, w+4, 12+Math.max(0,tall));
  }
  for (const k of SPECIES_ORDER){
    const total = G.total[k] || 0;
    const inFlight = fly.filter(f=>f.key===k).length;
    const shown = total - inFlight;
    const step = fishHudStep(total);
    const cx = fishHudColX(k);
    for (let j=0;j<shown;j++){
      drawFishShape(cx, FISH_HUD_Y0 + j*step, k, 1, FISH_HUD_SC, undefined, false);
    }
    // landing fish: travel from the catch spot to the next free slot of this pile
    let order = 0;
    for (const f of fly){
      if (f.key!==k) continue;
      const slotY = FISH_HUD_Y0 + (shown+order)*step; order++;
      const u = clamp(f.t/f.dur, 0, 1), e = u*u*(3-2*u);
      const x = lerp(f.x, cx, e);
      const y = lerp(f.y, slotY, e) - Math.sin(u*Math.PI)*10;
      drawFishShape(x, y, k, 1, lerp(0.85, FISH_HUD_SC, e), undefined, false);
    }
  }
}

function drawPlay(){
  drawSky();
  // v7.1: drawBank's flat rock-color fill was tuned for the old procedural
  // scene and reads as a mismatched patch over a real photo backdrop --
  // most visible on waves 5-6, whose narrower poolR (262/300, both <336)
  // triggered the pool-edge patch that the earlier per-wave-backdrop pass
  // never actually exercised (its verification script hardcoded poolR:336
  // for every forced wave, so this never showed up before). poolR itself
  // still narrows the fish/pool bounds for difficulty -- only the visible
  // fill is skipped once a real backdrop is in play.
  if (!waveBackdrop()){
    if (G.w.poolR < 336){
      drawBank(G.w.poolR, WATER_Y+6, BANK_X-G.w.poolR, BOT_Y-WATER_Y-6);
    }
  }
  drawWater(POOL_L, G.w.poolR, WATER_Y, BOT_Y, G.t);
  if (!waveBackdrop()) drawBank(POOL_L, BOT_Y, LW-POOL_L, LH-BOT_Y);
  drawCanyonWalls();
  if (!waveBackdrop() && !(SPR.ready && SPR.sceneImg)){
    // v3.0.4: this line marked the far-bank horizon against the old flat
    // procedural water fill. The scene backdrop already draws a real
    // horizon/bank line at that position, so this now reads as a stray
    // scratch across the image -- only draw it in the fallback path.
    ctx.strokeStyle = PAL.rockDk; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(BANK_X,WATER_Y); ctx.lineTo(LW,WATER_Y); ctx.stroke();
  }

  // v5: static pier -- always drawn, independent of whether a miner is
  // currently present (see drawMinerPier for why this is procedural
  // rather than a sprite crop).

  const oy = G.obsY;
  drawPlatform(oy);

  const ox = G.playerX + G.shoveX;
  const braced = !!keys['KeyB'];
  const sp = G.sp;
  const recovK = (sp.state==='RECOVERING' && sp.recovTotal) ? 1-(sp.recov/sp.recovTotal) : 0;
  drawFigure(ox, oy, braced, G.playerMoving, sp.angle, sp.state, sp.charge, recovK, sp.flightTicks||0);

  if (!sp.live && sp.state!=='RECOVERING'){
    const a = sp.angle*D2R;
    let ex = ox+(WATER_Y-oy)/Math.tan(a), ey = WATER_Y;
    if (ex > LW){ ex = LW; ey = oy+(LW-ox)*Math.tan(a); }
    ctx.strokeStyle = 'rgba(43,29,16,0.55)'; ctx.lineWidth=1;
    dashedLine(ox+3, oy-6, ex, ey);
    drawReticle(ex, ey);
  }
  if (sp.live){
    let n = Math.sqrt(sp.vx*sp.vx+sp.vy*sp.vy); if (n===0) n=1;
    drawSpear(sp.x-sp.vx/n*24, sp.y-sp.vy/n*24, sp.x, sp.y, 6);
  } else if (sp.state==='COCKED'){
    // v3.0: sprite figure bakes in a held spear, so skip the procedural
    // pulled-back spear when the sprite is doing the drawing (see the
    // matching spriteEligible gate in drawFigure()).
    // v3.0.2: checks cockedImg now, matching drawFigure's actual COCKED sprite
    // v3.0.6: checks figImg now -- the dedicated cockedImg sprite is gone,
    // COCKED uses the same aim-bucket sprite as every other state.
    const usedSpriteCocked = !braced && (PLAYER_FIG_BUCKETS.length > 0 || (SPR.ready && SPR.figImg));
    if (!usedSpriteCocked){
      const back = clamp(sp.charge,0,1);
      drawSpear(ox+2, oy-9, ox-8-back*8, oy-17-back*6, 5);
    }
  } else if (sp.state!=='RECOVERING'){
    // v3.0: the sprite figure (drawFigure's IDLE branch, same gating condition)
    // already bakes a spear into the pose art, so skip the procedural one here
    // to avoid drawing two overlapping spears. See drawFigure() for the match.
    const usedSprite = !braced && sp.state==='IDLE' && (PLAYER_FIG_BUCKETS.length > 0 || (SPR.ready && SPR.figImg));
    if (!usedSprite){
      const a = sp.angle*D2R;
      drawSpear(ox+2, oy-8, ox+2+Math.cos(a)*22, oy-8+Math.sin(a)*22, 5);
    }
  }
  if (G.stuck) drawSpear(G.stuck.x+4, G.stuck.y-20, G.stuck.x, G.stuck.y, 5);

  for (const f of G.fish){
    const dir = f.vx>=0 ? 1 : -1;
    const dt2 = clamp((f.fy-WATER_Y)/110,0,1);
    // v5: the only call site that animates -- live in-river fish should
    // swim/flap; every other drawFishShape call (trophy row, tally
    // portrait, "taken" flying fish) omits this and gets a still frame.
    drawFishShape(f.fx, f.fy, f.s.key, dir, 1, lerp(1,0.6,dt2), true);
  }
  if (G.hitFlash){
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(G.hitFlash.x-2, G.hitFlash.y-2, 4, 4);
  }
  for (const t of G.taken){
    const k = t.t/50;
    const x = lerp(t.x, t.tx, k), y = lerp(t.y, WATER_Y-10, k);
    drawFishShape(x, y, t.s.key, -1);
  }
  for (const m of G.miners){ if (m.type==='vinegar') drawVinegarMiner(m); else drawMiner(m); }
  if (G.minerHit){
    const mh = G.minerHit, k = 1-(mh.t/16), r = 4+k*10;
    ctx.strokeStyle = PAL.gold; ctx.lineWidth=1.6;
    for (let a=0;a<8;a++){
      const ang = a*(Math.PI/4);
      ctx.beginPath();
      ctx.moveTo(mh.x+Math.cos(ang)*r*0.4, mh.y+Math.sin(ang)*r*0.4);
      ctx.lineTo(mh.x+Math.cos(ang)*r, mh.y+Math.sin(ang)*r);
      ctx.stroke();
    }
  }
  for (const r of G.rocks){
    if (r.kind==='vinegar'){
      r.rot = (r.rot||0)+0.35;
      ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.rot);
      ctx.fillStyle = PAL.glassGrn; ctx.fillRect(-1.5,-3,3,6);
      ctx.restore();
      ctx.strokeStyle='rgba(74,107,82,0.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(r.x-r.vx*2, r.y-r.vy*2); ctx.lineTo(r.x,r.y); ctx.stroke();
    } else if (r.skin==='archer'){
      // v7 §1.3: reads as a shot, not a lobbed rock -- a short bright streak
      // along the flatter/faster arc instead of a tumbling square.
      ctx.strokeStyle='#e8e0c0'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(r.x-r.vx*1.2,r.y-r.vy*1.2); ctx.lineTo(r.x+r.vx*0.6,r.y+r.vy*0.6); ctx.stroke();
    } else if (r.skin==='prospector'){
      // v7 §1.4: gem/nugget is flavor only -- same hit as a plain rock.
      // v7.3.1: added the same fading motion-trail vinegar/archer already
      // had -- a bare 3x3 square with no trail reads as a single flickering
      // dot at 30fps once it's moving fast, easy to lose track of entirely
      // (reported as "the rocks disappear") against the new, busier,
      // larger character art. Plain rockthrower rocks below get the same
      // fix, for the same reason.
      ctx.strokeStyle='rgba(232,210,74,0.4)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(r.x-r.vx*2, r.y-r.vy*2); ctx.lineTo(r.x,r.y); ctx.stroke();
      ctx.fillStyle='#e8d24a'; ctx.fillRect(r.x-1.5,r.y-1.5,3,3);
    } else {
      ctx.strokeStyle='rgba(90,95,102,0.4)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(r.x-r.vx*2, r.y-r.vy*2); ctx.lineTo(r.x,r.y); ctx.stroke();
      ctx.fillStyle='#5a5f66'; ctx.fillRect(r.x-1.5,r.y-1.5,3,3);
    }
  }
  drawDrops();

  // v5: upper-left HUD is icon-only now -- HEALTH (hearts) and CHARGE
  // ENERGY (spear-tick + gold bar), both always visible, no text labels.
  // LIVES dropped out of this corner entirely; it's still shown on the
  // LIFELOST overlay (see drawLifeLost) when a life is actually lost.
  drawHearts(2,3);
  drawFishHud();
  // v5: charge bar is now persistent (reads empty at rest, fills with
  // sp.charge) instead of only appearing while COCKED -- sp.charge is
  // reliably 0 in every non-charging state (see updateThrow/fire/etc.),
  // so this is safe to draw unconditionally.
  iconSpearTick(4, 40);
  ctx.fillStyle = PAL.gold; ctx.fillRect(14, 42, Math.min(40, 4+sp.charge*40), 3);
  drawBanner();
}

function isNewlySeen(k){ return G.newlySeen.includes(k); }
function drawTally(){
  drawSky();
  drawWater(0, LW, 196, LH, G.t);
  const page = G.tallyPages[G.tallyPage] || {type:'summary'};

  if (page.type==='intro'){
    boldCText('WAVE '+G.wave+' COMPLETE', 92, 24);
    ctext(G.w.name, 118, {font:'13px Georgia', color:'#4a3018'});
    if (G.t>20) ctext('PRESS ENTER', 168, {font:'bold 13px Georgia'});
  } else if (page.type==='species'){
    const k = page.key, s = SPECIES[k], n = G.cache[k]||0;
    drawFishShape(LW/2, 92, k, 1, 3.4);
    boldCText(s.name, 132, 19);
    ctext('CAUGHT x'+n, 150, {font:'13px Georgia'});
    if (isNewlySeen(k)) wrapText(s.note, LW/2, 168, 280, 14, {font:'11px Georgia'});
    if (G.t>20) ctext('PRESS ENTER', 202, {font:'bold 13px Georgia'});
  } else if (page.type==='miners'){
    iconMinerHit(LW/2, 100, 3.4);
    boldCText('MINERS SPEARED', 132, 19);
    // v5: shows the session-wide running total (G.minersSpeared) instead
    // of the per-wave count. G.minersSpearedWave is kept around purely as
    // this page's *gate* (buildTallyPages only adds this page when at
    // least one miner was speared THAT wave) -- it no longer drives the
    // displayed number, which is why it still exists even though a
    // per-wave figure isn't shown anymore.
    ctext('TOTAL x'+G.minersSpeared, 150, {font:'13px Georgia'});
    if (G.t>20) ctext('PRESS ENTER', 202, {font:'bold 13px Georgia'});
  } else {
    // v4.4: this page used to show a SCORE total (species point-values
    // summed) -- removed along with the rest of the scoring system
    // (fish .val, the EXTEND bonus-life-at-30-points mechanic) per
    // direction. Just a plain closing line now, no number attached.
    boldCText('WAVE CLEAR', 100, 24);
    if (G.t>20){
      if (G.wave>=WAVES.length) ctext('ENTER \u2014 THE FINAL RUN IS DONE', 150, {font:'bold 13px Georgia'});
      else ctext('ENTER \u2014 NEXT WAVE', 150, {font:'bold 13px Georgia'});
    }
  }
}

// ---------------------------------------------------------------
// ending sequence — rebuilt from the Lua's drawBoat/drawPineSkyline/
// drawEndPanel (7-point hull, seated rower, swinging oars, fixed
// pine-skyline silhouette, continuous two-way scroll through the
// same panel content/order). No crank in a browser, so the scroll
// is driven by Up/Down or the mouse wheel instead of "undock the
// crank". v2 adds a final-tally line to the fish-count panel.
function buildPineSkyline(){
  const trees=[]; let x=0, i=0;
  while (x < LW+20){ trees.push({x, h: 14+(i*7%18)}); x += 14+(i*5%10); i++; }
  return trees;
}
const PINES = buildPineSkyline();
function drawPineSkyline(baseY){
  ctx.strokeStyle = PAL.ink; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,baseY); ctx.lineTo(LW,baseY); ctx.stroke();
  for (const t of PINES){
    const w=10;
    for (let tier=0;tier<3;tier++){
      const tw = w-tier*3;
      ctx.fillStyle = tier===0 ? PAL.rockMd : (tier===1?PAL.rockDk:'#241a10');
      ctx.fillRect(t.x-tw/2, baseY-t.h+tier*6, tw, 6);
    }
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(t.x-1, baseY-2, 2, 4);
  }
}
function drawBoat(x, y, phase){
  ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.wood; ctx.lineWidth=1.2;
  const hull = [[-16,4],[-12,8],[12,8],[16,4],[14,-2],[-14,-2],[-16,4]];
  ctx.beginPath();
  ctx.moveTo(x+hull[0][0], y+hull[0][1]);
  for (let i=1;i<hull.length;i++) ctx.lineTo(x+hull[i][0], y+hull[i][1]);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.moveTo(x-11,y+1); ctx.lineTo(x+11,y+1); ctx.stroke();
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(x-2, y-9, 5, 7);
  ctx.fillStyle = '#8a5a34';
  ctx.fillRect(x-3, y-13, 6, 4);
  ctx.strokeStyle = '#5a4326'; ctx.lineWidth=1.4;
  const a = Math.sin(phase)*0.9;
  for (const side of [-1,1]){
    const ox=x, oy=y-6;
    const ex = ox+side*Math.cos(a)*18, ey = oy-Math.sin(a)*10-2;
    ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle='#2b1d10'; ctx.fillRect(ex-2,ey-2,4,4);
  }
}
function plate(x,y,w,h){
  ctx.fillStyle = 'rgba(253,248,236,0.92)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
}
const qrImg = new Image();
let qrReady = false, qrFailed = false;
qrImg.onload = () => { qrReady = true; };
qrImg.onerror = () => { qrFailed = true; };
qrImg.src = 'claimjumper-images/qr.png';

const PANEL_H = 240, N_PANELS = 7;
function drawEndPanel(idx, top){
  if (idx===1){ plate(60, top+94, 280, 32); ctext('The salmon came up the Boise River.', top+114); }
  else if (idx===2){ plate(90, top+94, 220, 32); ctext('Two dams sealed it for good.', top+114); }
  else if (idx===3){ plate(80, top+94, 240, 32); ctext('No salmon have returned since.', top+114); }
  else if (idx===4){
    let n=0; for (const v of Object.values(G.total)) n+=v;
    plate(90, top+82, 220, 58);
    boldCText(n+' FISH TAKEN', top+103, 16);
    ctext('BEST WAVE '+G.bestWave+' \u00b7 '+G.livesUsed+' LIVES USED', top+120, {font:'10px Georgia', color:'#4a3018'});
    ctext(G.minersSpeared+' MINERS SPEARED', top+133, {font:'10px Georgia', color:'#4a3018'});
  } else if (idx===5){
    plate(60, top+86, 280, 48);
    ctext('POST TENEBRAS LUX', top+106);
    ctext('LUX ESTO UMBRAS FINDENS', top+124);
  } else if (idx===6){
    plate(100, top+94, 200, 32); boldCText('TRY. FAIL. LEARN.', top+117, 16);
  } else if (idx===7){
    if (qrReady){
      const iw=44, ih=44;
      plate(LW/2-iw/2-6, top+96-ih/2-6, iw+12, ih+12);
      ctx.drawImage(qrImg, LW/2-iw/2, top+96-ih/2, iw, ih);
    } else {
      plate(LW/2-110, top+80, 220, 48);
      ctext(qrFailed ? 'QR UNAVAILABLE' : 'LOADING QR\u2026', top+96);
      ctext('lux_esto@protonmail.com', top+112, {font:'10px Georgia'});
    }
  }
}
function updateEnd(dt){
  const spd = 220; // px/sec of logic-space scroll, keyboard-driven equivalent of the crank
  let d = 0;
  if (keys['ArrowDown'] || keys['KeyS']) d += spd*dt;
  if (keys['ArrowUp']   || keys['KeyW']) d -= spd*dt;
  d += wheelDelta; wheelDelta = 0;
  G.endScroll = clamp(G.endScroll + d, 0, (N_PANELS-1)*PANEL_H);
  G.endStroke += Math.abs(d)*0.05;
}
let wheelDelta = 0;
cv.addEventListener('wheel', e => { wheelDelta += e.deltaY*0.5; e.preventDefault(); }, {passive:false});
function drawEnd(){
  drawSky();
  drawPineSkyline(200);
  for (let i=1;i<=N_PANELS;i++){
    const top = (i-1)*PANEL_H - G.endScroll;
    if (top < LH && top+PANEL_H > 0) drawEndPanel(i, top);
  }
  drawBoat(50, 212, G.endStroke);
  // v3.0.1: the hint now appears exactly when Enter starts working, not
  // 60 ticks (2s) before it -- see the tick()-side fix for why the delay
  // itself was moved out too.
  if (G.t>90) ctext('SCROLL WITH \u2191\u2193 \u00b7 ENTER TO SKIP', 230, {font:'11px Georgia', color:'#4a3018'});
}

// ---------------------------------------------------------------
// main loop — fixed 30Hz logic tick (matches the Playdate build's
// pd.display.setRefreshRate(30) exactly), drawn every animation frame.
function tick(){
  G.t += 1;
  const dt = TICK_DT;

  const enterDown = !!keys['Enter'];
  const enterPressed = enterDown && !prevA;
  prevA = enterDown;

  if (G.mode==='TITLE'){
    musicSet(MUS_TITLE);
    if (enterPressed) startRun();
  } else if (G.mode==='WAVEINTRO'){
    musicSet(MUS_TITLE);
    if (G.t>90 || enterPressed){ G.mode='PLAY'; G.t=0; }
  } else if (G.mode==='PLAY'){
    musicSet(null);
    updatePlay();
  } else if (G.mode==='LIFELOST'){
    musicSet(null);
    G.fallT += 1;
    if (G.fallT>60){
      if (G.lives > 0){
        resumeWave();
        G.mode='PLAY'; G.t=0;
      } else if (G.credits > 0){
        G.mode='CONTINUE'; G.continueT=300; G.t=0;
      } else {
        G.bestWave = Math.max(G.bestWave, G.wave);
        G.mode='END'; G.t=0; G.endScroll=0; G.endStroke=0;
      }
    }
  } else if (G.mode==='CONTINUE'){
    musicSet(null);
    if (keys['Escape']){
      G.bestWave = Math.max(G.bestWave, G.wave);
      G.mode='END'; G.t=0; G.endScroll=0; G.endStroke=0;
    } else {
      G.continueT -= 1;
      if (enterPressed){
        G.credits -= 1;
        G.lives = 3;
        if (!G.vinegarSpawned) scheduleVinegar(); // a continue can bring him back (GDD §7.1)
        resumeWave();
        G.mode='PLAY'; G.t=0;
      } else if (G.continueT<=0){
        G.bestWave = Math.max(G.bestWave, G.wave);
        G.mode='END'; G.t=0; G.endScroll=0; G.endStroke=0;
      }
    }
  } else if (G.mode==='TALLY'){
    musicSet(null);
    if (G.t>20 && enterPressed){
      if (G.tallyPage < G.tallyPages.length-1){ G.tallyPage += 1; G.t=0; sfxPageTurn(); }
      else {
        G.wave += 1;
        if (G.wave > WAVES.length){ G.bestWave=Math.max(G.bestWave,WAVES.length); G.mode='END'; G.t=0; G.endScroll=0; G.endStroke=0; }
        else startWave();
      }
    }
  } else if (G.mode==='END'){
    musicSet(MUS_TITLE);
    updateEnd(dt);
    // v3.0.1: was G.t>15 (0.5s) -- every other screen (TITLE, WAVEINTRO,
    // TALLY, CONTINUE) uses Enter as "advance/confirm", so a player who's
    // been tapping Enter through tally pages lands on END and, out of pure
    // muscle memory, hits Enter again almost immediately. On every other
    // screen that's the right thing to do; here it means "skip to title" --
    // so it silently skips the entire end-credits sequence, which reads
    // exactly like "the game just restarted." This wasn't touched by any
    // of the session's other changes, but it's a real trap and worth
    // fixing now that it's been hit: 90 ticks (3s) gives the credits time
    // to actually be seen, and the on-screen hint (drawEnd) now only
    // appears once the skip is actually live, instead of advertising it
    // 2 seconds before it does anything.
    if (G.t>90 && enterPressed){ G.mode='TITLE'; G.t=0; }
  }
  musicTick();
}

function draw(){
  ctx.save();
  ctx.setTransform(DRAW_SCALE,0,0,DRAW_SCALE,0,0);
  ctx.clearRect(0,0,LW,LH);
  ctx.fillStyle = '#fdf8ec'; ctx.fillRect(0,0,LW,LH);
  if (G.mode==='TITLE') drawTitle();
  else if (G.mode==='WAVEINTRO') drawWaveIntro();
  else if (G.mode==='PLAY') drawPlay();
  else if (G.mode==='LIFELOST') drawLifeLost();
  else if (G.mode==='CONTINUE') drawContinue();
  else if (G.mode==='TALLY') drawTally();
  else if (G.mode==='END') drawEnd();
  ctx.restore();
}

G.sp = newSpear();
// Same fixed 30Hz step / 6-tick-per-frame cap as the original hand-rolled
// accumulator loop (STEP_MS=1000/30, iter<6) -- just running on the shared
// engine's loop instead of a bespoke one in every game file.
new GameLoop({ update: tick, render: draw, step: 1 / 30, maxUpdatesPerFrame: 6 }).start();
</script>
